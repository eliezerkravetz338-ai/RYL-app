<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RYL — Run Your League</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --g:#16a34a; --gd:#15803d; --gl:#22c55e; --gm:#dcfce7;
      --n1:#060d08; --n2:#0d1611; --n3:#141f16;
      --f8:#f8faf8; --f4:#f0f4f0;
      --t1:#0a110b; --t2:#374b39; --t3:#5a7060; --t4:#8fa494;
      --b1:#e2ebe3; --b2:#c4d4c6;
      --red:#ef4444; --amber:#f59e0b; --gold:#f59e0b; --gold-dim:#78350f; --gold-glow:rgba(245,158,11,.15);
      --sh:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.06);
      --sh2:0 4px 24px rgba(0,0,0,.12);
      --sh3:0 8px 40px rgba(0,0,0,.18);
      --r:10px; --rl:16px; --rx:24px;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--f8);
      color: var(--t1);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }
    button, input, select, textarea { font-family: 'DM Sans', sans-serif; }
    button { cursor: pointer; border: none; transition: all .15s; }
    .nav { height: 52px; background: var(--n1); border-bottom: 1px solid rgba(255,255,255,.06); display:flex; align-items:center; justify-content:space-between; padding:0 18px; position:sticky; top:0; z-index:20; }
    .logo-mark { background: var(--g); color:#fff; font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:13px; padding:3px 7px; border-radius:5px; letter-spacing:.5px; }
    .logo-text { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:16px; color:#fff; letter-spacing:.3px; margin-left:7px; }
    .nav-tabs { display:flex; gap:1px; margin-left:20px; overflow:auto; }
    .ntab { padding:6px 11px; color:rgba(255,255,255,.4); font-size:12px; font-weight:500; background:transparent; border-radius:7px; white-space:nowrap; }
    .ntab.on { color:#fff; background:rgba(255,255,255,.1); }
    .ntab.live { color: var(--gl); font-weight:700; }
    .nav-right { display:flex; align-items:center; gap:8px; }
    .league-chip { background:rgba(22,163,74,.15); border:1px solid rgba(22,163,74,.3); color:var(--gl); font-size:10px; font-weight:600; padding:3px 8px; border-radius:20px; }
    .nav-av { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; color:#fff; background: var(--g); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:8px 16px; border-radius:var(--r); font-weight:600; font-size:13px; white-space:nowrap; }
    .btn-p { background:var(--g); color:#fff; }
    .btn-p:hover { background:var(--gd); transform:translateY(-1px); box-shadow:0 4px 12px rgba(22,163,74,.3); }
    .btn-d { background:var(--n2); color:#fff; border:1px solid rgba(255,255,255,.09); }
    .btn-o { background:#fff; color:var(--t1); border:1.5px solid var(--b2); }
    .btn-gh { background:transparent; color:var(--t2); border:1.5px solid var(--b1); }
    .btn-red { background:#dc2626; color:#fff; }
    .btn-sm { padding:6px 14px; min-height:34px; font-size:12px; border-radius:10px; font-weight:700; line-height:1; }
    .btn-xs { padding:3px 8px; font-size:11px; border-radius:6px; font-weight:600; }
    .btn-lg { padding:11px 24px; font-size:14px; border-radius:12px; font-weight:700; }
    .btn-xl { padding:14px 30px; font-size:15px; border-radius:13px; font-weight:700; }
    .card { background:#fff; border:1px solid var(--b1); border-radius:var(--rl); box-shadow:var(--sh); overflow:hidden; }
    .chd { padding:12px 16px; border-bottom:1px solid var(--b1); display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .chd h3 { font-size:13px; font-weight:700; color:var(--t1); }
    .cbd { padding:16px; }
    .fg { margin-bottom:12px; }
    .fl { display:block; font-size:10px; font-weight:600; color:var(--t2); margin-bottom:4px; letter-spacing:.2px; text-transform:uppercase; }
    .fi { width:100%; background:#fff; border:1.5px solid var(--b2); color:var(--t1); padding:8px 11px; border-radius:8px; font-size:13px; }
    .fi:focus { outline:none; border-color:var(--g); box-shadow:0 0 0 3px rgba(22,163,74,.1); }
    textarea.fi { resize:vertical; min-height:90px; }
    .fr2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .badge { display:inline-flex; align-items:center; padding:2px 7px; border-radius:20px; font-size:10px; font-weight:600; }
    .bg-green { background:var(--gm); color:var(--gd); }
    .bg-gray { background:var(--f4); color:var(--t2); border:1px solid var(--b1); }
    .bg-dark { background:var(--n3); color:rgba(255,255,255,.7); }
    .land { background:var(--n1); min-height:calc(100vh - 52px); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px 20px; text-align:center; position:relative; overflow:hidden; }
    .land::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 80% 50% at 50% -5%,rgba(22,163,74,.18) 0%,transparent 65%); }
    .land-eye { display:inline-flex; align-items:center; gap:5px; background:rgba(22,163,74,.1); border:1px solid rgba(22,163,74,.22); color:var(--gl); font-size:11px; font-weight:600; padding:4px 11px; border-radius:20px; margin-bottom:16px; letter-spacing:.5px; text-transform:uppercase; position:relative; }
    .land-h1 { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:60px; color:#fff; line-height:.95; letter-spacing:-1.5px; margin-bottom:14px; position:relative; }
    .land-h1 em { color:var(--gl); font-style:normal; }
    .land-sub { font-size:15px; color:rgba(255,255,255,.42); max-width:420px; line-height:1.7; margin-bottom:32px; position:relative; }
    .land-btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; position:relative; }
    .land-demo { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09); color:rgba(255,255,255,.45); font-size:12px; padding:7px 14px; border-radius:8px; margin-bottom:44px; position:relative; }
    .land-stats { display:flex; gap:36px; justify-content:center; padding-top:32px; border-top:1px solid rgba(255,255,255,.06); position:relative; }
    .ls-v { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:28px; color:#fff; }
    .ls-l { font-size:11px; color:rgba(255,255,255,.28); margin-top:2px; }
    .wiz-wrap, .join-wrap { background:var(--f8); min-height:calc(100vh - 52px); padding:24px 18px; display:flex; align-items:flex-start; justify-content:center; }
    .wiz-inner { max-width:640px; width:100%; }
    .join-card, .wiz-card { background:#fff; border:1px solid var(--b1); border-radius:var(--rx); box-shadow:var(--sh2); padding:26px; width:100%; }
    .pb { display:flex; align-items:center; margin-bottom:24px; }
    .pb-c { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
    .pb-c.done { background:var(--g); color:#fff; }
    .pb-c.act { background:var(--n2); color:#fff; box-shadow:0 0 0 3px rgba(22,163,74,.2); }
    .pb-c.pend { background:var(--b1); color:var(--t3); }
    .pb-lbl { font-size:10px; font-weight:600; color:var(--t3); white-space:nowrap; margin-left:6px; }
    .pb-lbl.act { color:var(--t1); font-weight:700; }
    .pb-line { flex:1; height:1.5px; background:var(--b1); margin:0 5px; }
    .pb-line.done { background:var(--g); }
    .wiz-title { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:28px; color:var(--t1); margin-bottom:3px; letter-spacing:-.3px; }
    .wiz-sub { font-size:13px; color:var(--t3); margin-bottom:20px; line-height:1.6; }
    .wiz-foot { display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding-top:16px; border-top:1px solid var(--b1); }
    .step-info { font-size:11px; color:var(--t3); }
    .tgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .tslot { background:var(--f8); border:1.5px solid var(--b1); border-radius:var(--r); padding:10px; }
    .sw-row { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
    .sw { width:16px; height:16px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
    .sw.sel { border-color:#000; }
    .al { padding:10px 12px; border-radius:10px; font-size:12px; }
    .al-g { background:var(--gm); color:var(--gd); border:1px solid rgba(22,163,74,.2); }
    .code-box { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); border-radius:10px; padding:9px 14px; display:flex; align-items:center; gap:10px; width:fit-content; }
    .code-val { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:20px; color:#fff; letter-spacing:2.5px; }
    .code-lbl { font-size:9px; color:rgba(255,255,255,.3); font-weight:600; text-transform:uppercase; letter-spacing:.8px; margin-bottom:2px; }
    .lobby-hero, .draft-hero, .ph, .comm-hero, .rb, .sch-top, .transition-hero { background:var(--n1); position:relative; overflow:hidden; }
    .transition-hero.playoff { background:linear-gradient(135deg,#0c0900,#1a1100,#0c0900); }
    .playoff-nav-accent { background:linear-gradient(90deg,#92400e,#b45309,#92400e) !important; }
    @keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }
    .confetti-piece { position:fixed;width:8px;height:8px;border-radius:2px;animation:confettiFall linear forwards;pointer-events:none;z-index:9999; }
    .bracket-line { stroke:var(--b1);stroke-width:1.5;fill:none; }
    .bracket-team { transition:opacity .3s; }
    .bracket-team.loser { opacity:.35; }
    .draft-hero { background:linear-gradient(180deg,#0b0f14 0%, #111827 100%); border-bottom:1px solid #1f2937; padding:14px 20px 6px; }
    .draft-hero::before { background:radial-gradient(ellipse 60% 80% at 15% 50%,rgba(34,197,94,.18) 0%,transparent 65%); pointer-events:none; z-index:0; }
    .draft-hero > * { position:relative; z-index:1; }
    .lobby-hero::before, .draft-hero::before, .ph::before, .rb::before, .sch-top::before, .transition-hero::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 60% 80% at 15% 50%,rgba(22,163,74,.12) 0%,transparent 65%); pointer-events:none; }
    .lobby-hero { padding:28px 20px 24px; }
    .lobby-lname { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:34px; color:#fff; letter-spacing:-.5px; margin-bottom:4px; position:relative; }
    .lobby-div { font-size:11px; color:rgba(255,255,255,.3); font-weight:500; text-transform:uppercase; letter-spacing:.8px; margin-bottom:8px; position:relative; }
    .lobby-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; position:relative; }
    .lobby-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; padding:16px; }
    .transition-hero { min-height:calc(100vh - 52px); display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 20px; }
    .transition-inner { position:relative; z-index:2; max-width:520px; }
    .transition-kicker { font-size:11px; color:rgba(255,255,255,.35); font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; }
    .transition-title { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:58px; line-height:.95; color:#fff; letter-spacing:-1.5px; margin-bottom:12px; }
    .transition-sub { font-size:15px; color:rgba(255,255,255,.5); line-height:1.7; }
    .nav-arr { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.09); color:#fff; font-size:14px; display:flex; align-items:center; justify-content:center; }
    .draft-hero { padding:14px 16px 0; }
    .draft-top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; position:relative; }
    .otc-left { display:flex; align-items:center; gap:12px; }
    .team-av-lg { width:62px; height:62px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:20px; flex-shrink:0; border:2.5px solid rgba(255,255,255,.1); }
    .rnd-badge { display:inline-flex; align-items:center; background:var(--f4); border:1px solid var(--b1); color:var(--t2); font-size:9px; font-weight:700; padding:2px 8px; border-radius:20px; margin-bottom:4px; letter-spacing:.8px; text-transform:uppercase; }
    .otc-lbl { font-size:11px; font-weight:700; color:var(--gd); letter-spacing:.8px; text-transform:uppercase; margin-bottom:2px; }
    .otc-team { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:24px; line-height:1; letter-spacing:-.5px; color:var(--t1); }
    .otc-sub { font-size:11px; color:var(--t3); margin-top:3px; }
    .timer-box { text-align:center; flex-shrink:0; }
    .timer-lbl { font-size:9px; font-weight:700; color:var(--t3); letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
    .timer-num { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:36px; line-height:1; min-width:58px; text-align:center; letter-spacing:-.5px; }
    .t-ok { color:var(--t1); } .t-warn { color:var(--amber); } .t-hot { color:var(--red); }
    .timer-bar { height:3px; background:var(--b1); border-radius:2px; margin-top:6px; overflow:hidden; width:90px; margin-left:auto; margin-right:auto; }
    .timer-fill { height:100%; background:var(--gl); border-radius:2px; transition:width 1s linear; }
    .strip { display:flex; align-items:center; padding:9px 0 0; border-top:1px solid rgba(255,255,255,.06); overflow-x:auto; }
    .strip-lbl { font-size:9px; font-weight:700; color:rgba(255,255,255,.25); letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap; padding-right:12px; margin-right:12px; border-right:1px solid rgba(255,255,255,.06); flex-shrink:0; }
    .sp { display:flex; align-items:center; gap:4px; padding:4px 9px; border-radius:6px; white-space:nowrap; flex-shrink:0; border:1px solid transparent; }
    .sp.cur { background:rgba(22,163,74,.18); border-color:rgba(22,163,74,.35); }
    .sp-num { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:11px; color:rgba(255,255,255,.3); }
    .sp.cur .sp-num { color:var(--gl); }
    .sp-av { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:7px; font-weight:800; flex-shrink:0; font-family:'Barlow Condensed',sans-serif; }
    .sp-ab { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:10px; color:rgba(255,255,255,.45); }
    .sp.cur .sp-ab { color:#fff; }
    .last-pick { padding:6px 20px; font-size:11px; color:rgba(255,255,255,.28); background:rgba(0,0,0,.2); border-top:1px solid rgba(255,255,255,.04); }
    .last-pick span { color:rgba(255,255,255,.52); font-weight:600; }
    .draft-cols { display:grid; grid-template-columns:1fr .82fr .82fr; gap:10px; padding:10px; }
    .board-hd { background:#fff; padding:9px 13px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; border-bottom:1px solid var(--b1); }
    .board-hd h3 { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:12px; color:var(--t1); letter-spacing:.5px; text-transform:uppercase; }
    .board-search { background:var(--f8); border:1px solid var(--b2); color:var(--t1); padding:4px 9px; border-radius:20px; font-size:11px; width:110px; }
    .board-col-hd { display:grid; grid-template-columns:26px 1fr 36px 68px; align-items:center; padding:5px 12px; background:var(--f8); border-bottom:1px solid var(--b1); }
    .board-col-hd span { font-size:9px; font-weight:700; color:var(--t3); text-transform:uppercase; letter-spacing:.7px; }
    .pl-row { display:grid; grid-template-columns:26px 1fr 36px 68px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--b1); }
    .pl-av { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:700; flex-shrink:0; }
    .pl-nm { font-size:13px; font-weight:600; color:var(--t1); padding:0 7px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .pl-rank { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px; color:var(--t3); text-align:center; }
    .pl-acts { display:flex; gap:3px; justify-content:flex-end; }
    .draft-btn { background:var(--n2); color:#fff; padding:5px 10px; border-radius:5px; font-size:11px; font-weight:700; }
    .q-btn { background:var(--f4); color:var(--t2); padding:5px 7px; border-radius:5px; font-size:11px; font-weight:600; }
    .q-btn.in { background:var(--gm); color:var(--gd); }
    .ord-row, .tm-row { display:flex; align-items:center; gap:7px; padding:8px 12px; border-bottom:1px solid var(--b1); }
    .ord-row.cur { background:rgba(22,163,74,.05); border-left:3px solid var(--g); }
    .ord-row.done { opacity:.3; }
    .ord-num { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:13px; color:var(--t4); min-width:22px; }
    .ord-nm { font-size:12px; font-weight:500; color:var(--t1); flex:1; }
    .ord-tag { font-size:9px; font-weight:700; padding:2px 5px; border-radius:3px; text-transform:uppercase; letter-spacing:.3px; }
    .tag-otc { background:rgba(22,163,74,.12); color:var(--gd); }
    .tag-next { background:var(--f4); color:var(--t3); }
    .tm-av { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; flex-shrink:0; }
    .tm-info { flex:1; }
    .tm-nm { font-size:12px; font-weight:600; color:var(--t1); }
    .tm-last { font-size:10px; color:var(--t3); margin-top:1px; }
    .tm-cnt { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px; color:var(--t3); }
    .queue-bar, .auto-bar { background:var(--n3); border-top:1px solid rgba(255,255,255,.05); padding:8px 14px; display:flex; align-items:center; gap:9px; }
    .q-lbl { font-size:9px; font-weight:700; color:rgba(255,255,255,.28); letter-spacing:1px; text-transform:uppercase; white-space:nowrap; }
    .q-scroll { display:flex; gap:5px; flex:1; overflow-x:auto; }
    .q-tag { display:inline-flex; align-items:center; gap:3px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.09); border-radius:5px; padding:3px 8px; font-size:11px; font-weight:600; color:rgba(255,255,255,.7); white-space:nowrap; }
    .q-empty, .auto-bar span { font-size:11px; color:rgba(255,255,255,.3); }
    .auto-bar strong { color:rgba(255,255,255,.55); }
    .std-hr, .std-row { display:grid; grid-template-columns:28px 1fr 40px 40px 56px 46px; align-items:center; }
    .std-hr { padding:6px 16px; background:var(--f4); border-bottom:1px solid var(--b2); }
    .std-hr span { font-size:9px; font-weight:700; color:var(--t3); text-transform:uppercase; letter-spacing:.7px; }
    .std-row { padding:11px 16px; border-bottom:1px solid var(--b1); }
    .std-rank { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:14px; }
    .std-team { display:flex; align-items:center; gap:7px; }
    .std-num { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; text-align:center; }
    .sch-top { padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
    .sch-title { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:24px; color:#fff; letter-spacing:-.3px; }
    .sch-sub { font-size:11px; color:rgba(255,255,255,.3); margin-top:2px; }
    .dot-strip { display:flex; gap:5px; padding:9px 20px; background:rgba(0,0,0,.25); overflow-x:auto; }
    .gdt { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:10px; border:1.5px solid rgba(255,255,255,.08); color:rgba(255,255,255,.35); background:rgba(255,255,255,.04); flex-shrink:0; }
    .gdt.on { background:var(--g); border-color:var(--g); color:#fff; }
    .gdt.done { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.07); color:rgba(255,255,255,.3); }
    .sch-body { padding:14px 18px; }
    .gc { background:#fff; border:1px solid var(--b1); border-radius:var(--rl); box-shadow:var(--sh); margin-bottom:8px; overflow:hidden; }
    .gc-inner { display:flex; align-items:center; padding:12px 14px; }

.home-wrap {
  padding: 14px 18px 18px;
}

.home-hero {
  background: var(--n1);
  color: #fff;
  border-radius: var(--rx);
  padding: 20px 22px;
  margin: 14px 18px 0;
  position: relative;
  overflow: hidden;
  box-shadow: var(--sh2);
}

.home-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 65% 90% at 15% 50%, rgba(22,163,74,.14) 0%, transparent 70%);
  pointer-events: none;
}

.home-hero-live::before {
  background: radial-gradient(ellipse 65% 90% at 15% 50%, rgba(239,68,68,.16) 0%, transparent 70%);
}

.home-hero-actions,
.home-hero-kicker,
.home-hero-main,
.home-hero-main-score,
.home-hero-matchup,
.home-hero-sub {
  position: relative;
  z-index: 1;
}

.home-hero-actions {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.home-hero-kicker {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: rgba(255,255,255,.42);
  margin-bottom: 8px;
}

.home-hero-main {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 40px;
  line-height: .95;
  font-weight: 900;
  letter-spacing: -.8px;
  margin-bottom: 8px;
}

.home-hero-main-score {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 54px;
  line-height: .95;
  font-weight: 900;
  letter-spacing: -1px;
  margin-top: 10px;
}

.home-hero-dash {
  color: rgba(255,255,255,.45);
}

.home-hero-matchup {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 6px;
}

.home-hero-sub {
  font-size: 12px;
  color: rgba(255,255,255,.48);
}

.home-grid {
  display: grid;
  grid-template-columns: 1.5fr .9fr;
  gap: 14px;
  padding: 14px 18px 18px;
}

.home-left,
.home-right {
  display: grid;
  gap: 14px;
  align-content: start;
}

.home-card {
  background: #fff;
}

.home-table-head,
.home-table-row {
  display: grid;
  grid-template-columns: 28px 1fr 50px;
  align-items: center;
}

.home-table-head {
  padding: 4px 0 8px;
  border-bottom: 1px solid var(--b1);
}

.home-table-head span {
  font-size: 10px;
  font-weight: 700;
  color: var(--t3);
  text-transform: uppercase;
  letter-spacing: .7px;
}

.home-table-row {
  padding: 11px 0;
  border-bottom: 1px solid var(--b1);
  font-size: 13px;
  color: var(--t1);
}

.home-table-row-top {
  font-weight: 700;
}

.home-game-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--b1);
}

.home-game-left {
  min-width: 0;
}

.home-game-matchup {
  font-size: 13px;
  font-weight: 700;
  color: var(--t1);
}

.home-game-meta {
  font-size: 11px;
  color: var(--t3);
  margin-top: 2px;
}

.home-game-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
  flex-shrink: 0;
}

.home-game-score {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--t1);
}

.home-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .4px;
}

.home-badge-live {
  background: rgba(239,68,68,.12);
  color: #dc2626;
}

.home-badge-final {
  background: var(--f4);
  color: var(--t2);

      return {

        joinColor: STATE.joinColor
      };
    }

    // ── Supabase persistence ──────────────────────────────────────

    async function saveState() {
      // Always keep local leagues array in sync
      if (STATE.league && STATE.activeLeagueId) {
        const leagueCopy = JSON.parse(JSON.stringify(STATE.league));
        const idx = STATE.leagues.findIndex(l => l.id === STATE.activeLeagueId);
        if (idx >= 0) STATE.leagues[idx] = leagueCopy;
        else STATE.leagues.push(leagueCopy);
      }

      // If logged in, persist to Supabase
      if (STATE.user && STATE.activeLeagueId && STATE.league) {
        const { error: saveErr } = await sb.from('leagues').upsert({
          id: STATE.activeLeagueId,
          name: STATE.league.name || 'My League',
          commissioner_id: STATE.user.id,
          data: STATE.league,
          updated_at: new Date().toISOString()
        }, { onConflict: 'id' });
        if (saveErr) {
          console.error('saveState failed:', saveErr.message);
        }
      } else {
        // Not logged in — use localStorage as fallback
        try {
          localStorage.setItem(LEAGUES_KEY, JSON.stringify(STATE.leagues));
          localStorage.setItem(ACTIVE_LEAGUE_KEY, STATE.activeLeagueId || '');
          localStorage.setItem(STORAGE_KEY, JSON.stringify(getSerializableState()));
        } catch(e) {}
      }
    }

    async function loadState() {
      if (STATE.user) {
        // Logged in — load from Supabase
        try {
          const { data: memberships } = await sb
            .from('league_members')
            .select('league_id, role, team_id')
            .eq('user_id', STATE.user.id);

          if (memberships && memberships.length > 0) {
            const leagueIds = memberships.map(m => m.league_id);
            const { data: leagues } = await sb
              .from('leagues')
              .select('id, name, data')
              .in('id', leagueIds);

            if (leagues && leagues.length > 0) {
              STATE.leagues = leagues.map(l => ({ ...l.data, id: l.id, name: l.name }));
              // Set active league
              const saved = localStorage.getItem(ACTIVE_LEAGUE_KEY);
              const active = STATE.leagues.find(l => l.id === saved) || STATE.leagues[0];
              if (active) {
                STATE.league = active;
                STATE.activeLeagueId = active.id;
                // Set role from membership
                const myMembership = memberships.find(m => m.league_id === active.id);
                if (myMembership) {
                  STATE.memberRole = myMembership.role;
                  STATE.memberTeamId = myMembership.team_id;
                }
              }
              STATE.screen = 'app';
            }
          }
        } catch (err) {
          console.warn('Supabase load failed', err);
        }
      } else {
        // Not logged in — try localStorage
        try {
          const leaguesRaw = localStorage.getItem(LEAGUES_KEY);
          if (leaguesRaw) STATE.leagues = JSON.parse(leaguesRaw);
          const activeId = localStorage.getItem(ACTIVE_LEAGUE_KEY);
          if (activeId && STATE.leagues.find(l => l.id === activeId)) {
            STATE.activeLeagueId = activeId;
            STATE.league = STATE.leagues.find(l => l.id === activeId);
          } else if (STATE.leagues.length > 0) {
            STATE.activeLeagueId = STATE.leagues[0].id;
            STATE.league = STATE.leagues[0];
          }
          if (STATE.league) STATE.screen = 'app';
        } catch (err) {}
      }
    }

    async function refreshLeagueFromDB() {
      if (!STATE.user || !STATE.activeLeagueId) return;
      const { data: league } = await sb
        .from('leagues')
        .select('id, name, data')
        .eq('id', STATE.activeLeagueId)
        .single();
      if (league) {
        const updated = { ...league.data, id: league.id, name: league.name };
        STATE.league = updated;
        const idx = STATE.leagues.findIndex(l => l.id === league.id);
        if (idx >= 0) STATE.leagues[idx] = updated;
        R();
      }
    }

    function clearSavedState() {
      try {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(LEAGUES_KEY);
        localStorage.removeItem(ACTIVE_LEAGUE_KEY);
      } catch (err) {}
    }

    // ── Auth functions ─────────────────────────────────────────────

    async function signUp(email, password, displayName) {
      STATE.authError = null; R();

      // Basic validation
      if (password.length < 8) {
        STATE.authError = 'Password must be at least 8 characters.';
        R(); return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        STATE.authError = 'Please enter a valid email address.';
        R(); return;
      }

      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { display_name: displayName } }
      });

      if (error) { STATE.authError = error.message; R(); return; }

      // Check if email confirmation is required
      // If user session is null, it means confirmation email was sent
      if (data.user && !data.session) {
        // Email confirmation required — show message
        STATE.screen = 'confirm_email';
        STATE.confirmEmail = email;
        R();
        return;
      }

      // No confirmation required (dev mode) — proceed
      STATE.user = data.user;
      STATE.profile = { id: data.user.id, display_name: displayName };
      try { localStorage.clear(); } catch(e) {}
      await loadState();
      STATE.authLoading = false;
      STATE.screen = STATE.leagues.length > 0 ? 'app' : 'landing';
      R();
    }

    async function signIn(email, password) {
      STATE.authError = null; R();

      if (!email || !password) {
        STATE.authError = 'Please enter your email and password.';
        R(); return;
      }

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        // Give friendly error messages
        if (error.message.includes('Email not confirmed')) {
          STATE.authError = 'Please check your email and click the confirmation link before signing in.';

          STATE.authError = 'Incorrect email or password. Please try again.';
        } else {
          STATE.authError = error.message;
        }
        R(); return;
      }

      STATE.user = data.user;
      const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();

      try { localStorage.clear(); } catch(e) {}
      await loadState();
      STATE.authLoading = false;
      STATE.screen = STATE.leagues.length > 0 ? 'app' : 'landing';
      R();

      // Step 1: Save league
      const { error: leagueErr } = await sb.from('leagues').upsert({

        name: league.name || 'My League',

        data: league,

    async function joinLeagueByCode(code) {
      STATE.joinError = null; R();
      const cleanCode = (code||'').toUpperCase().trim();

      // Validate all fields
      if (!cleanCode) { STATE.joinError = 'Please enter a league code.'; R(); return; }
      if (!STATE.joinName?.trim()) { STATE.joinError = 'Please enter your full name.'; R(); return; }
      if (!STATE.joinSkill) { STATE.joinError = 'Please select your skill level (1-5).'; R(); return; }
      if (!STATE.user) { STATE.joinError = 'You must be logged in to join a league.'; R(); return; }

      // Find the league
      const { data: league, error } = await sb
        .from('leagues')
        .select('id, name, data')
        .eq('id', cleanCode)
        .maybeSingle();
      if (error || !league) {
        STATE.joinError = `League "${cleanCode}" not found. Double-check the code.`;
        R(); return;
      }

      // Check already a member
      const { data: existing } = await sb
        .from('league_members')
        .select('id')
        .eq('league_id', league.id)
        .eq('user_id', STATE.user.id)
        .maybeSingle();
      if (existing) {
        STATE.joinError = 'You are already in this league.';
        R(); return;
      }

      // Add to league_members
      const { error: memberErr } = await sb.from('league_members').insert({
        league_id: league.id,
        user_id: STATE.user.id,
        role: 'player',
        team_id: null
      });
      if (memberErr) {
        STATE.joinError = 'Failed to join league. Please try again.';
        R(); return;
      }

      // Add player to the league's player pool
      const leagueData = { ...league.data, id: league.id, name: league.name };
      if (!leagueData.players) leagueData.players = [];
      const newPlayer = {
        id: STATE.user.id,         // use their auth ID as player ID
        name: STATE.joinName.trim(),
        skill: STATE.joinSkill,
        teamId: null,
        userId: STATE.user.id
      };
      // Only add if not already in pool
      if (!leagueData.players.find(p => p.userId === STATE.user.id)) {
        leagueData.players.push(newPlayer);
      }

      // Save updated league data back to Supabase
      await sb.from('leagues').update({
        data: leagueData,
        updated_at: new Date().toISOString()
      }).eq('id', league.id);

      // Update local state
      STATE.leagues.push(leagueData);
      STATE.league = leagueData;
      STATE.activeLeagueId = league.id;
      STATE.memberRole = 'player';
      STATE.memberTeamId = null;
      STATE.screen = 'app';
      STATE.appTab = 'home';
      STATE.justJoined = true;
      STATE.joinName = '';
      STATE.joinSkill = 0;
      STATE.joinCodeInput = '';
      subscribeToLeague(league.id);
      R();
    }

    // ── Realtime subscription ──────────────────────────────────────
    let _realtimeChannel = null;

    function subscribeToLeague(leagueId) {
      if (_realtimeChannel) _realtimeChannel.unsubscribe();
      _realtimeChannel = sb
        .channel('league:' + leagueId)
        // League data changes (scores, draft picks, etc.)
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'leagues',
          filter: 'id=eq.' + leagueId
        }, payload => {
          const updated = { ...payload.new.data, id: payload.new.id, name: payload.new.name };
          STATE.league = updated;
          const idx = STATE.leagues.findIndex(l => l.id === leagueId);
          if (idx >= 0) STATE.leagues[idx] = updated;
          R();
        })
        // Member role changes (captain assignment)
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'league_members',
          filter: 'league_id=eq.' + leagueId
        }, async payload => {
          // If this update is for the current user, refresh their role
          if (payload.new.user_id === STATE.user?.id) {
            STATE.memberRole = payload.new.role;
            STATE.memberTeamId = payload.new.team_id;
            // Also refresh league data to get latest
            await refreshLeagueFromDB();
          }
        })
        .subscribe();
    }

        const file = e.target.files[0];

          try {
            const league = JSON.parse(ev.target.result);
            if (!league.id || !league.name) throw new Error('Invalid league file');
            const exists = STATE.leagues.find(l => l.id === league.id);

        reader.readAsText(file);
      };
      input.click();

    function cleanInitials(name) {

      const key = String(name || '').toLowerCase();
      const presets = [
        { keys: ['storm', 'thunder', 'lightning'], mark: '⚡', gradient: 'linear-gradient(135deg,#1d4ed8,#38bdf8)' },
        { keys: ['fire', 'flame', 'heat', 'blaze'], mark: '🔥', gradient: 'linear-gradient(135deg,#991b1b,#f97316)' },

      ];
      const match = presets.find(p => p.keys.some(k => key.includes(k)));

    // ── Playoff bracket helpers ──────────────────────────────────
    function mkGame(home, away, hSeed, aSeed, extra) {
      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      return { id: uid(), home, away, homeSeed: hSeed, awaySeed: aSeed, hs: null, as: null, status: 'upcoming', winner: null, ...extra };
    }

    function generateBracket(league, numTeams, seeding, format, playIn) {
      const seeds = seeding.slice(0, numTeams);
      const isBest3 = format === 'best3';
      let rounds = [];

      // Helper: make a series game object
      const game = (h, a, hS, aS, extra) => mkGame(h, a, hS, aS, extra);

      // Helper: wrap a round's games into a series if best-of-3 (play-in always single)
      // In best-of-3 mode, each matchup is ONE game object that tracks the series internally.
      // seriesWins: { [teamId]: count } — updated each time a game is scored.
      // gamesPlayed: array of { hs, as, winner } — history of individual games.
      function wrapSeries(roundGames, roundName, forceSingle) {
        if (!isBest3 || forceSingle) return { name: roundName, games: roundGames, format: 'single' };
        const seriesGames = roundGames.map(g => ({
          ...g,
          format: 'best3',
          seriesWins: {},    // { teamId: wins }
          gamesPlayed: [],   // [{ hs, as, winner }]
          status: 'upcoming'
        }));
        return { name: roundName, games: seriesGames, format: 'best3' };
      }

      if (playIn && numTeams === 8) {
        // Play-In: 5v8, 6v7 (always single game), winners join 1-4 in semis
        rounds = [
          { name: 'Play-In', games: [
            game(seeds[4], seeds[7], 5, 8),
            game(seeds[5], seeds[6], 6, 7),
          ], format: 'single', isPlayIn: true },
          wrapSeries([
            game(seeds[0], null, 1, null, { fromPlayIn: 0 }),
            game(seeds[1], null, 2, null, { fromPlayIn: 0 }),
            game(seeds[2], null, 3, null, { fromPlayIn: 1 }),
            game(seeds[3], null, 4, null, { fromPlayIn: 1 }),
          ], 'Quarterfinals'),
          wrapSeries([
            game(null, null, null, null, { fromGames: [0, 1] }),
            game(null, null, null, null, { fromGames: [2, 3] }),
          ], 'Semifinals'),
          wrapSeries([
            game(null, null, null, null, { fromGames: [0, 1] }),
          ], 'Championship'),
        ];
      } else if (numTeams === 4) {
        rounds = [
          wrapSeries([
            game(seeds[0], seeds[3], 1, 4),
            game(seeds[1], seeds[2], 2, 3),
          ], 'Semifinals'),
          wrapSeries([
            game(null, null, null, null, { fromGames: [0, 1] }),
          ], 'Championship'),
        ];
      } else if (numTeams === 6) {
        rounds = [
          wrapSeries([
            game(seeds[2], seeds[5], 3, 6),
            game(seeds[3], seeds[4], 4, 5),
          ], 'First Round'),
          wrapSeries([
            game(seeds[0], null, 1, null, { fromGame: 0 }),
            game(seeds[1], null, 2, null, { fromGame: 1 }),
          ], 'Semifinals'),
          wrapSeries([
            game(null, null, null, null, { fromGames: [0, 1] }),
          ], 'Championship'),
        ];
      } else if (numTeams === 8) {
        rounds = [
          wrapSeries([
            game(seeds[0], seeds[7], 1, 8),
            game(seeds[1], seeds[6], 2, 7),
            game(seeds[2], seeds[5], 3, 6),
            game(seeds[3], seeds[4], 4, 5),
          ], 'Quarterfinals'),
          wrapSeries([
            game(null, null, null, null, { fromGames: [0, 1] }),
            game(null, null, null, null, { fromGames: [2, 3] }),
          ], 'Semifinals'),
          wrapSeries([
            game(null, null, null, null, { fromGames: [0, 1] }),
          ], 'Championship'),
        ];
      }
      return rounds;
    }

    function getPlayoffSeedMap(bracket) {
      // Build a map of teamId → seed from all bracket games
      const map = {};
      if (!bracket) return map;
      bracket.forEach(round => {
        round.games.forEach(g => {
          if (g.home && g.homeSeed) map[g.home] = g.homeSeed;
          if (g.away && g.awaySeed) map[g.away] = g.awaySeed;
        });
      });
      return map;
    }

    function getSeriesWinner(g) {
      // g is a best-of-3 game object with seriesWins
      if (g.format !== 'best3' || !g.seriesWins) return null;
      const entry = Object.entries(g.seriesWins).find(([, w]) => w >= 2);
      return entry ? entry[0] : null;
    }

    function getSeriesLabel(g) {
      // Returns display string like "2-0" or "1-1"
      if (g.format !== 'best3') return null;
      if (!g.home || !g.away) return null;
      const hw = (g.seriesWins && g.seriesWins[g.home]) || 0;
      const aw = (g.seriesWins && g.seriesWins[g.away]) || 0;
      if (hw === 0 && aw === 0) return null;
      return hw + '–' + aw;
    }

    function advanceBracket(league) {
      const pc = league.playoffConfig;
      if (!pc || !pc.bracket) return league;
      const rounds = pc.bracket;
      const seedMap = getPlayoffSeedMap(rounds);

      for (let ri = 0; ri < rounds.length - 1; ri++) {
        const curRound  = rounds[ri];
        const nextRound = rounds[ri + 1];
        const isBest3   = curRound.format === 'best3';
        const isPlayIn  = curRound.isPlayIn;

        if (isBest3) {
          curRound.games.forEach((g, gi) => {
            if (g.status !== 'final' || !g.winner) return;
            const winner = g.winner;
            const wSeed = seedMap[winner] || (winner === g.home ? g.homeSeed : g.awaySeed) || null;
            nextRound.games.forEach(ng => {
              if (!ng.fromGames) return;
              let matched = false;
              ng.fromGames.forEach((fgi, slot) => {
                if (fgi !== gi) return;
                matched = true;
                if (slot === 0) { ng.home = winner; ng.homeSeed = wSeed; }
                if (slot === 1) { ng.away = winner; ng.awaySeed = wSeed; }
              });
              // Only reset series state if the next game hasn't started yet
              if (matched && ng.home && ng.away && (!ng.gamesPlayed || ng.gamesPlayed.length === 0) && (!ng.seriesWins || Object.keys(ng.seriesWins).length === 0)) {
                ng.seriesWins = {};
                ng.gamesPlayed = [];
                ng.status = 'upcoming';
                ng.hs = null;
                ng.as = null;
                ng.winner = null;
                ng.loser = null;
              }
            });
          });
        } else if (isPlayIn) {
          // Play-In: 5v8 winner → fills spot in QF, 6v7 winner → fills spot in QF
          curRound.games.forEach((g, gi) => {
            if (g.status !== 'final' || !g.winner) return;
            const wSeed = seedMap[g.winner] || (g.winner === g.home ? g.homeSeed : g.awaySeed);
            nextRound.games.forEach(ng => {
              if (ng.fromPlayIn === gi) {
                // Fill the open away slot of the matching QF game
                if (!ng.away) { ng.away = g.winner; ng.awaySeed = wSeed; }
              }
            });
          });
        } else {
          // Single elimination
          curRound.games.forEach((g, gi) => {
            if (g.status !== 'final' || !g.winner) return;
            const wSeed = seedMap[g.winner] || (g.winner === g.home ? g.homeSeed : g.awaySeed);
            nextRound.games.forEach(ng => {
              if (ng.fromGame === gi) { ng.away = g.winner; ng.awaySeed = wSeed; }
              if (ng.fromGames) {
                ng.fromGames.forEach((fgi, slot) => {
                  const src = curRound.games[fgi];
                  if (fgi === gi && src?.winner) {
                    const wS = seedMap[src.winner] || (src.winner === src.home ? src.homeSeed : src.awaySeed);
                    if (slot === 0) { ng.home = src.winner; ng.homeSeed = wS; }
                    if (slot === 1) { ng.away = src.winner; ng.awaySeed = wS; }
                  }
                });
              }
            });
          });
        }
      }
      // Directly update the bracket in place and return the league
      league.playoffConfig.bracket = rounds;
      return league;
    }

    function scorePlayoffGame(roundIdx, gameIdx) {
      const pc = STATE.league.playoffConfig;
      if (!pc) return;
      const g = pc.bracket[roundIdx].games[gameIdx];
      const isBest3 = g.format === 'best3';
      const played = g.gamesPlayed || [];
      const gameNum = played.length + 1;
      // For best-of-3, alternate home/away each game
      const isFlipped = isBest3 && gameNum % 2 === 0;
      const homeId = isFlipped ? g.away : g.home;
      const awayId = isFlipped ? g.home : g.away;
      const home = STATE.league.teams.find(t => t.id === homeId);
      const away = STATE.league.teams.find(t => t.id === awayId);
      if (!home || !away) return;
      if (g.hs == null) g.hs = 0;
      if (g.as == null) g.as = 0;
      const roundName = pc.bracket[roundIdx].name;
      const hw = (g.seriesWins && g.seriesWins[g.home]) || 0;
      const aw = (g.seriesWins && g.seriesWins[g.away]) || 0;
      const seriesInfo = isBest3 ? ` — Game ${gameNum}${played.length>0?` (Series ${hw}–${aw})`:''}` : '';
      const title = `${roundName}${seriesInfo} — ${home.name} vs ${away.name}`;
      const body = `
        <div class='scoreboard-card'>
          <div class='score-team-panel'>
            <div class='score-team-name'>${home.name}</div>
            <div id='scoreHomeBig' class='score-big'>${g.hs ?? 0}</div>

            <div class='score-pill-grid'>

              <button class='score-pill minus' onclick='adjustScore("hs",-2)'>-2</button>
              <button class='score-pill minus' onclick='adjustScore("hs",-3)'>-3</button>
            </div>
          </div>
          <div class='score-team-panel'>
            <div class='score-team-name'>${away.name}</div>
            <div id='scoreAwayBig' class='score-big'>${g.as ?? 0}</div>
            <input id='as' type='hidden' value='${g.as ?? 0}'>
            <div class='score-pill-grid'>
              <button class='score-pill' onclick='adjustScore("as",1)'>+1</button>
              <button class='score-pill' onclick='adjustScore("as",2)'>+2</button>
              <button class='score-pill' onclick='adjustScore("as",3)'>+3</button>
              <button class='score-pill minus' onclick='adjustScore("as",-1)'>-1</button>
              <button class='score-pill minus' onclick='adjustScore("as",-2)'>-2</button>
              <button class='score-pill minus' onclick='adjustScore("as",-3)'>-3</button>
            </div>
          </div>

    function markPlayoffGameFinal(roundIdx, gameIdx) {
      const hs = parseInt(document.getElementById('hs')?.value || '0');
      const as_ = parseInt(document.getElementById('as')?.value || '0');
      if (hs === as_) { alert('Playoff games cannot end in a tie. Enter a final score.'); return; }
      const pc   = STATE.league.playoffConfig;
      const g    = pc.bracket[roundIdx].games[gameIdx];
      const isBest3 = g.format === 'best3';
      const played = g.gamesPlayed || [];
      const gameNum = played.length + 1;
      const isFlipped = isBest3 && gameNum % 2 === 0;
      const homeId = isFlipped ? g.away : g.home;
      const awayId = isFlipped ? g.home : g.away;
      const home = STATE.league.teams.find(t => t.id === homeId);
      const away = STATE.league.teams.find(t => t.id === awayId);
      const winner = hs > as_ ? home?.name : away?.name;
      // Show confirmation like regular season
      // For best-of-3, calculate what the series would be after this game
      const pendingWins = isBest3 ? { ...(g.seriesWins || {}) } : null;
      if (isBest3) {
        const pendingWinnerId = hs > as_ ? homeId : awayId;
        pendingWins[pendingWinnerId] = (pendingWins[pendingWinnerId] || 0) + 1;
      }
      const pendingSeriesWinner = isBest3
        ? Object.entries(pendingWins).find(([,w]) => w >= 2)?.[0]
        : null;
      const pendingWinnerTeam = pendingSeriesWinner ? STATE.league.teams.find(t => t.id === pendingSeriesWinner) : null;
      const pendingHW = isBest3 ? (pendingWins[g.home] || 0) : 0;
      const pendingAW = isBest3 ? (pendingWins[g.away] || 0) : 0;
      const nextGameNum = isBest3 ? (g.gamesPlayed?.length || 0) + 2 : null;
      const confirmBody = `<div style='text-align:center;padding:8px 0'>
        <div style='font-size:32px;margin-bottom:12px'>${pendingWinnerTeam ? '🏆' : '✅'}</div>
        <div style='font-size:13px;color:var(--t2);line-height:1.6'>Mark this game as final?</div>
        <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:28px;color:var(--t1);margin:10px 0'>${hs} – ${as_}</div>
        <div style='font-size:13px;font-weight:700;color:var(--gd)'>
          ${pendingWinnerTeam
            ? `${pendingWinnerTeam.name} wins the series ${pendingHW > pendingAW ? pendingHW+'-'+pendingAW : pendingAW+'-'+pendingHW}!`
            : isBest3
            ? `${winner} leads series ${pendingHW}–${pendingAW} · Game ${nextGameNum} next`
            : `${winner} advances`}
        </div>
      </div>`;
      openModal('Confirm Final Score', confirmBody,
        `<button class='btn btn-gh btn-sm' onclick='closeModal()'>Cancel</button>
         <button class='btn btn-p btn-sm' onclick='closeModal();confirmPlayoffFinal(${roundIdx},${gameIdx},${hs},${as_})'>Mark Final</button>`
      );
    }

    function confirmPlayoffFinal(roundIdx, gameIdx, hs, as_) {
      // Always work directly on STATE.league.playoffConfig.bracket
      const bracket = STATE.league.playoffConfig.bracket;
      const round = bracket[roundIdx];
      const g = round.games[gameIdx];
      // Guard: don't score if teams not set or series already over
      if (!g.home || !g.away) return;
      if (g.status === 'final') return;
      const isLastRound = roundIdx === bracket.length - 1;
      const isBest3 = g.format === 'best3';
      const played = g.gamesPlayed || [];
      const gameNum = played.length + 1;
      const isFlipped = isBest3 && gameNum % 2 === 0;
      const homeId = isFlipped ? g.away : g.home;
      const awayId = isFlipped ? g.home : g.away;
      const gameWinner = hs > as_ ? homeId : awayId;
      const gameLoser  = hs > as_ ? awayId : homeId;

      if (isBest3) {
        if (!g.gamesPlayed) g.gamesPlayed = [];
        g.gamesPlayed.push({ hs, as: as_, winner: gameWinner });
        if (!g.seriesWins) g.seriesWins = {};
        g.seriesWins[gameWinner] = (g.seriesWins[gameWinner] || 0) + 1;
        g.hs = null; g.as = null;
        const seriesWinner = getSeriesWinner(g);
        if (seriesWinner) {
          g.status = 'final';
          g.winner = seriesWinner;
          g.loser  = seriesWinner === g.home ? g.away : g.home;
          // Advance bracket directly
          doAdvanceBracketDirect(bracket, roundIdx, gameIdx);
          if (isLastRound) {
            STATE.league.playoffConfig.champion = seriesWinner;
            STATE.league.status = 'complete';
            closeModal(); saveState(); R();
            setTimeout(() => triggerChampionCelebration(), 300);
            return;
          }
        } else {
          g.status = 'active';
        }
        closeModal(); saveState(); R();
        return;
      }

      // Single elimination
      g.hs = hs; g.as = as_;
      g.status = 'final';
      g.winner = gameWinner;
      g.loser  = gameLoser;
      doAdvanceBracketDirect(bracket, roundIdx, gameIdx);
      const isLastGame = gameIdx === round.games.length - 1;
      if (isLastRound && isLastGame) {
        STATE.league.playoffConfig.champion = g.winner;
        STATE.league.status = 'complete';
        closeModal(); saveState(); R();
        setTimeout(() => triggerChampionCelebration(), 300);
        return;
      }
      closeModal(); saveState(); R();
    }

    // Advance a specific game's winner to the next round directly
    function doAdvanceBracketDirect(bracket, fromRound, fromGame) {
      if (fromRound >= bracket.length - 1) return;
      const g = bracket[fromRound].games[fromGame];
      if (!g.winner) return;
      const winner = g.winner;
      const seedMap = getPlayoffSeedMap(bracket);
      const wSeed = seedMap[winner] || (winner === g.home ? g.homeSeed : g.awaySeed) || null;
      const nextRound = bracket[fromRound + 1];
      nextRound.games.forEach(ng => {
        if (ng.fromGame === fromGame) {
          ng.away = winner; ng.awaySeed = wSeed;
        }
        if (ng.fromGames) {
          ng.fromGames.forEach((fgi, slot) => {
            if (fgi !== fromGame) return;
            if (slot === 0) { ng.home = winner; ng.homeSeed = wSeed; }
            if (slot === 1) { ng.away = winner; ng.awaySeed = wSeed; }
          });
          // Reset series state when both slots filled
          // Only reset if next game hasn't started yet
          if (ng.home && ng.away && ng.format === 'best3' && (!ng.gamesPlayed || ng.gamesPlayed.length === 0)) {
            ng.seriesWins = ng.seriesWins || {};
            ng.gamesPlayed = ng.gamesPlayed || [];
            if (ng.status !== 'active' && ng.status !== 'final') ng.status = 'upcoming';
          }
        }
        if (ng.fromPlayIn === fromGame) {
          if (!ng.away) { ng.away = winner; ng.awaySeed = wSeed; }
        }
      });
    }

    function renderPlayoffHome() {
      const l  = STATE.league;
      const pc = l.playoffConfig;
      if (!pc || !pc.bracket) return renderSeasonHome();

      // Find current playoff matchup — live game first, then first upcoming
      let currentGame = null, currentRound = null, currentRi = -1, currentGi = -1;
      // First pass: find any live game
      outer: for (let ri = 0; ri < pc.bracket.length; ri++) {
        for (let gi = 0; gi < pc.bracket[ri].games.length; gi++) {
          const g = pc.bracket[ri].games[gi];
          if (g.home && g.away && g.status === 'live') {
            currentGame = g; currentRound = pc.bracket[ri]; currentRi = ri; currentGi = gi;
            break outer;
          }
        }
      }
      // Second pass: first upcoming game if no live
      if (!currentGame) {
        outer2: for (let ri = 0; ri < pc.bracket.length; ri++) {
          for (let gi = 0; gi < pc.bracket[ri].games.length; gi++) {
            const g = pc.bracket[ri].games[gi];
            if (g.home && g.away && g.status !== 'final') {
              currentGame = g; currentRound = pc.bracket[ri]; currentRi = ri; currentGi = gi;
              break outer2;
            }
          }
        }
      }

      // Champion declared
      const champion = l.teams.find(t => t.id === pc.champion);
      const champId  = champion ? smartTeamIdentity(champion) : null;

      // Build hero — current playoff matchup
      const heroHtml = (() => {
        if (champion) {
