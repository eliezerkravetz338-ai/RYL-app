            <div style='position:relative;z-index:1'>
              <div style='font-size:10px;font-weight:800;color:rgba(245,158,11,.7);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px'>🏆 League Champion</div>
              <div style='width:72px;height:72px;border-radius:50%;background:${champId.gradient};display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:24px;color:#fff;margin:0 auto 12px;border:3px solid rgba(245,158,11,.4)'>${champId.mark}</div>
              <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:44px;color:#f59e0b;letter-spacing:-.5px;line-height:1'>${champion.name}</div>
              <div style='font-size:12px;color:rgba(255,255,255,.4);margin-top:8px'>${l.name} · ${new Date().getFullYear()} Champion</div>
            </div>
          </div>`;
        }
        if (!currentGame) {
          return `<div style='background:var(--n1);padding:24px 22px;margin:14px 18px 0;border-radius:var(--rx);text-align:center'>
            <div style='font-size:28px;font-weight:900;color:#fff'>No games remaining</div>
          </div>`;
        }
        const home   = l.teams.find(t => t.id === currentGame.home);
        const away   = l.teams.find(t => t.id === currentGame.away);
        const homeId = smartTeamIdentity(home);
        const awayId = smartTeamIdentity(away);
        const seedMap = getPlayoffSeedMap(pc.bracket);
        const homeSeedDisplay = currentGame.homeSeed || seedMap[currentGame.home] || '?';
        const awaySeedDisplay = currentGame.awaySeed || seedMap[currentGame.away] || '?';
        const isFinal = currentGame.status === 'final';
        const homeWon = isFinal && currentGame.winner === currentGame.home;
        const awayWon = isFinal && currentGame.winner === currentGame.away;
        return `<div class='home-hero' style='margin:14px 18px 0;border-radius:var(--rx);position:relative;overflow:hidden'>
          <div style='position:absolute;inset:0;background:radial-gradient(ellipse 55% 100% at 0% 50%,${home.color}3a,transparent 55%),radial-gradient(ellipse 55% 100% at 100% 50%,${away.color}2e,transparent 55%),radial-gradient(circle at 50% 50%,rgba(245,158,11,.06),transparent 70%);pointer-events:none;z-index:0'></div>
          <div style='position:relative;z-index:1;padding:20px 22px'>
            <div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px'>
              <div style='display:inline-flex;align-items:center;gap:6px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);color:#f59e0b;font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px'>
                🏆 ${currentRound.name}
              </div>
              ${isFinal
                ? `<span style='background:rgba(22,163,74,.08);color:var(--gd);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px'>✓ Final</span>`
                : currentGame?.status === 'live'
                ? `<span style='display:inline-flex;align-items:center;gap:5px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#f87171;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.5px'><span style='width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulseDot 1.2s infinite'></span>LIVE</span>`
                : `<span style='background:rgba(245,158,11,.1);color:#f59e0b;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px'>Up Next</span>`}
            </div>
            <div style='display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px'>
              <div style='display:flex;align-items:center;gap:12px'>
                <div style='width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:18px;color:#fff;background:${homeId.gradient};border:2.5px solid rgba(255,255,255,.15);flex-shrink:0'>${homeId.mark}</div>
                <div>
                  <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:26px;color:${awayWon?"rgba(255,255,255,.3)":"#fff"};line-height:.95;letter-spacing:-.4px'>${home.name}</div>
                  <div style='font-size:11px;color:rgba(255,255,255,.45);margin-top:4px'>Seed #${homeSeedDisplay}</div>
                </div>
              </div>
              <div style='text-align:center;flex-shrink:0'>
                ${isFinal
                  ? `<div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:44px;line-height:1;letter-spacing:-1px'>
                      <span style='color:${homeWon?"#fff":"rgba(255,255,255,.3)"}'>${currentGame.hs}</span>
                      <span style='color:rgba(255,255,255,.25);font-size:28px'> · </span>
                      <span style='color:${awayWon?"#fff":"rgba(255,255,255,.3)"}'>${currentGame.as}</span>
                    </div>`
                  : currentGame?.status === 'live'
                  ? `<div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:44px;line-height:1;letter-spacing:-1px;color:#fff'>
                      ${currentGame.hs ?? 0}<span style='color:rgba(255,255,255,.3);font-size:28px'> · </span>${currentGame.as ?? 0}
                    </div>`
                  : `<div style='font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;color:rgba(255,255,255,.35)'>VS</div>`}
              </div>
              <div style='display:flex;align-items:center;gap:12px;justify-content:flex-end;text-align:right'>
                <div>
                  <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:26px;color:${homeWon?"rgba(255,255,255,.3)":"#fff"};line-height:.95;letter-spacing:-.4px'>${away.name}</div>
                  <div style='font-size:11px;color:rgba(255,255,255,.45);margin-top:4px'>Seed #${awaySeedDisplay}</div>
                </div>
                <div style='width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:18px;color:#fff;background:${awayId.gradient};border:2.5px solid rgba(255,255,255,.15);flex-shrink:0'>${awayId.mark}</div>
              </div>
            </div>
          </div>
        </div>`;
      })();

      // Activity feed — playoff results
      const playoffResults = pc.bracket.flatMap(r => r.games.filter(g => g.status === 'final').map(g => {
        const home = l.teams.find(t => t.id === g.home);
        const away = l.teams.find(t => t.id === g.away);
        const winner = l.teams.find(t => t.id === g.winner);
        const loser  = l.teams.find(t => t.id === g.loser);
        if (!winner || !loser) return null;
        return { tag: '🏆', text: `${r.name.toUpperCase()} — ${winner.name} defeat ${loser.name} ${Math.max(g.hs,g.as)}–${Math.min(g.hs,g.as)}` };
      })).filter(Boolean).reverse();

      // Remaining games
      const remaining = pc.bracket.flatMap((r,ri) => r.games.map((g,gi) => ({...g,roundName:r.name,ri,gi}))).filter(g => g.home && g.away && g.status !== 'final');

      return `
        ${heroHtml}

        <!-- Playoff stats strip -->
        <div style='display:flex;gap:10px;padding:12px 18px 0;overflow-x:auto;-webkit-overflow-scrolling:touch'>
          <div style='background:var(--n1);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 16px;min-width:120px;flex-shrink:0'>
            <div style='font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px'>Format</div>
            <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:20px;color:#fff;line-height:1.2'>${pc.numTeams}-Team</div>
          </div>
          <div style='background:var(--n1);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 16px;min-width:120px;flex-shrink:0'>
            <div style='font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px'>Games Left</div>
            <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:26px;color:#fff;line-height:1.1'>${remaining.length}</div>
          </div>
          ${pc.bracket.map(r => {
            const done = r.games.filter(g => g.status === 'final').length;
            const total = r.games.length;
            return `<div style='background:var(--n1);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;min-width:130px;flex-shrink:0'>
              <div style='font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px'>${r.name}</div>
              <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:20px;color:${done===total?"#4ade80":"#fff"};line-height:1.2'>${done}/${total} ${done===total?"✓":""}</div>
            </div>`;
          }).join('')}
        </div>

        <!-- Two column: upcoming games + activity -->
        <div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 18px 0'>
          <div class='card home-card'>
            <div class='chd'><h3>Playoff Schedule</h3><button onclick="STATE.appTab='playoffs';R()" style='padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);font-size:11px;font-weight:700;cursor:pointer'>View Bracket</button></div>
            <div class='cbd' style='padding:0'>
              ${remaining.length ? remaining.map(g => {
                const home = l.teams.find(t => t.id === g.home);
                const away = l.teams.find(t => t.id === g.away);
                const isLive = g.status === 'live';
                return `<div style='display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--b1);${isLive?"border-left:3px solid #ef4444;":""}'>
                  <div style='flex:1'>
                    <div style='font-size:10px;font-weight:700;color:${isLive?"#dc2626":"rgba(245,158,11,.8)"};text-transform:uppercase;letter-spacing:.5px'>${isLive?"🔴 LIVE — ":""}${g.roundName}</div>
                    <div style='font-size:12px;font-weight:700;color:var(--t1);margin-top:2px'>${home?.name} vs ${away?.name}</div>
                    ${isLive ? `<div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:20px;color:#dc2626;margin-top:4px'>${g.hs ?? 0} – ${g.as ?? 0}</div>` : ''}
                    ${!isLive && (g.time || g.court) ? `<div style='font-size:10px;color:var(--t3);margin-top:2px'>${[g.time,g.court].filter(Boolean).join(' · ')}</div>` : ''}
                  </div>
                  <button class='btn ${isLive?"btn-p":"btn-o"} btn-xs' onclick='scorePlayoffGame(${g.ri},${g.gi})'>${isLive?"Update":"Score"}</button>
                </div>`;
              }).join('') : `<div style='padding:20px;text-align:center;font-size:12px;color:var(--t3)'>${champion ? "Season complete!" : "All games scheduled"}</div>`}
            </div>
          </div>

          <div class='card home-card'>
            <div class='chd'><h3>Playoff Activity</h3></div>
            <div class='cbd' style='padding:0'>
              ${playoffResults.length ? playoffResults.map((item,i) => `
                <div style='display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:${i<playoffResults.length-1?"1px solid var(--b1)":"none"}'>
                  <div style='width:32px;height:32px;border-radius:10px;background:rgba(245,158,11,.1);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0'>${item.tag}</div>
                  <div style='font-size:12px;font-weight:600;color:var(--t2);line-height:1.5;padding-top:7px'>${item.text}</div>
                </div>`).join('') : `<div style='padding:24px;text-align:center;color:var(--t3);font-size:12px'>Results will appear here as games are scored.</div>`}
            </div>
          </div>
        </div>
        <div style='height:18px'></div>`;
    }


    function startPlayoffGame(ri, gi) {
      const g = STATE.league.playoffConfig?.bracket?.[ri]?.games?.[gi];
      if (!g || !g.home || !g.away) return;
      g.status = 'live';
      g.hs = 0;
      g.as = 0;
      saveState();
      R();
    }

    function adjustPlayoffScore(ri, gi, side, delta) {
      const g = STATE.league.playoffConfig?.bracket?.[ri]?.games?.[gi];
      if (!g) return;
      // For flipped games (even game numbers in best-of-3), hs/as are swapped visually
      // but we always store scores relative to g.home/g.away — so no flip needed here.
      // The flip only affects DISPLAY and winner calculation, not storage.
      g[side] = Math.max(0, (g[side] || 0) + delta);
      saveState();
      R();
    }

    function endPlayoffGame(ri, gi) {
      const g = STATE.league.playoffConfig?.bracket?.[ri]?.games?.[gi];
      if (!g) return;
      const hs = g.hs || 0;
      const as_ = g.as || 0;
      if (hs === as_) {
        openModal('Tied Score',
          `<div style='text-align:center;padding:12px 0'>
            <div style='font-size:32px;margin-bottom:10px'>🚫</div>
            <div style='font-size:14px;font-weight:700;color:var(--t1)'>Games cannot end in a tie</div>
            <div style='font-size:12px;color:var(--t2);margin-top:6px'>Adjust the score before ending the game.</div>
          </div>`,
          `<button class='btn btn-p btn-sm' onclick='closeModal()'>Got it</button>`);
        return;
      }
      const isBest3 = g.format === 'best3';
      const played = g.gamesPlayed || [];
      const gameNum = played.length + 1;
      const isFlipped = isBest3 && gameNum % 2 === 0;
      const homeId = isFlipped ? g.away : g.home;
      const awayId = isFlipped ? g.home : g.away;
      const home = STATE.league.teams.find(t => t.id === homeId);
      const away = STATE.league.teams.find(t => t.id === awayId);
      const winnerId = hs > as_ ? homeId : awayId;
      const winner = STATE.league.teams.find(t => t.id === winnerId);
      // Preview series result
      const pendingWins = { ...(g.seriesWins || {}) };
      if (isBest3) pendingWins[winnerId] = (pendingWins[winnerId] || 0) + 1;
      const seriesOver = isBest3 ? Object.entries(pendingWins).some(([,w]) => w >= 2) : true;
      const seriesNote = isBest3
        ? (seriesOver ? `🏆 ${winner?.name} wins the series!` : `${winner?.name} leads series ${Math.max(...Object.values(pendingWins))}–${Math.min(...Object.values(pendingWins))}`)
        : `${winner?.name} wins`;
      g.pendingFinalHs = hs;
      g.pendingFinalAs = as_;
      openModal(`End Game${isBest3 ? ` ${gameNum}` : ''}?`,
        `<div style='text-align:center;padding:8px 0'>
          <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:48px;color:var(--t1);line-height:1;margin-bottom:8px'>${hs} – ${as_}</div>
          <div style='font-size:13px;color:var(--t2)'>${home?.name} vs ${away?.name}</div>
          <div style='font-size:14px;font-weight:700;color:var(--gd);margin-top:8px'>${seriesNote}</div>
        </div>`,
        `<button class='btn btn-gh btn-sm' onclick='closeModal()'>Keep Playing</button>
         <button class='btn btn-p btn-sm' onclick='closeModal();confirmPlayoffFinal(${ri},${gi},${hs},${as_})'>✓ End Game</button>`
      );
    }

    function renderPlayoffSchedule() {
      const l = STATE.league;
      const pc = l.playoffConfig;
      if (!pc || !pc.bracket) return '<div class="empty-s"><h3>No playoff bracket yet</h3></div>';
      const seedMap = getPlayoffSeedMap(pc.bracket);
      const champion = l.teams.find(t => t.id === pc.champion);
      const totalRounds = pc.bracket.length;
      if (STATE.playoffRound >= totalRounds) STATE.playoffRound = totalRounds - 1;
      if (STATE.playoffRound < 0) STATE.playoffRound = 0;
      const selRound = pc.bracket[STATE.playoffRound];
      const ri = STATE.playoffRound;

      // Round pills — white bar style like regular season day pills
      const roundPills = pc.bracket.map((r, idx) => {
        const done = r.games.every(g => g.status === 'final');
        const live = r.games.some(g => g.status === 'live' || g.status === 'active');
        const isSel = idx === STATE.playoffRound;
        return `<button onclick='STATE.playoffRound=${idx};R()' style='
          flex-shrink:0;padding:8px 16px;border-radius:0;border:none;
          border-bottom:3px solid ${isSel?"#000":"transparent"};
          background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:80px'>
          <span style='font-size:10px;font-weight:600;color:${isSel?"#000":live?"#dc2626":done?"#16a34a":"#94a3b8"};text-transform:uppercase;letter-spacing:.5px'>${live?"🔴 Live":done?"Final":""}</span>
          <span style='font-size:13px;font-weight:${isSel?"800":"600"};color:${isSel?"#000":"#374151"}'>${r.name}</span>
        </button>`;
      }).join('');

      // Game cards — same ESPN style as regular season
      const gameCards = selRound.games.map((g, gi) => {
        const isBest3Game = g.format === 'best3';
        const played = g.gamesPlayed || [];
        const gameNum = played.length + 1;
        const isFlipped = isBest3Game && gameNum % 2 === 0;
        const homeId = isFlipped ? g.away : g.home;
        const awayId = isFlipped ? g.home : g.away;
        const home = l.teams.find(t => t.id === homeId);
        const away = l.teams.find(t => t.id === awayId);
        const homeTid = home ? smartTeamIdentity(home) : null;
        const awayTid = away ? smartTeamIdentity(away) : null;
        const isFinal = g.status === 'final';
        const isLive = g.status === 'live';
        const isActive = g.status === 'active';
        const isUpcoming = g.status === 'upcoming';
        const sWinsH = isBest3Game ? ((g.seriesWins && g.seriesWins[g.home]) || 0) : 0;
        const sWinsA = isBest3Game ? ((g.seriesWins && g.seriesWins[g.away]) || 0) : 0;
        const hSeed = g.homeSeed || seedMap[g.home] || null;
        const aSeed = g.awaySeed || seedMap[g.away] || null;
        const homeWon = isFinal && g.winner === g.home;
        const awayWon = isFinal && g.winner === g.away;

        if (!home || !away) {
          return `<div style='background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;text-align:center;color:#94a3b8;font-size:12px;font-style:italic;box-shadow:0 1px 4px rgba(0,0,0,.06)'>Waiting for previous round...</div>`;
        }

        // Series status for best-of-3
        const seriesWinnerId = isBest3Game ? getSeriesWinner(g) : null;
        const seriesStatus = isBest3Game
          ? (seriesWinnerId
            ? `${l.teams.find(t=>t.id===seriesWinnerId)?.name} wins series ${Math.max(sWinsH,sWinsA)}-${Math.min(sWinsH,sWinsA)}`
            : played.length > 0
            ? (sWinsH===sWinsA ? `Game ${gameNum} · Series tied ${sWinsH}-${sWinsA}` : `Game ${gameNum} · ${sWinsH>sWinsA?home.name:away.name} leads ${Math.max(sWinsH,sWinsA)}-${Math.min(sWinsH,sWinsA)}`)
            : `Game 1 · Best of 3`)
          : null;

        // Status label
        const statusLabel = isFinal
          ? `<span style='font-size:11px;font-weight:800;color:#374151;letter-spacing:.5px'>FINAL</span>`
          : isLive
          ? `<span style='display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#dc2626'><span style='width:6px;height:6px;border-radius:50%;background:#dc2626;animation:pulseDot 1.2s infinite;flex-shrink:0'></span>LIVE</span>`
          : isActive
          ? `<span style='font-size:11px;font-weight:700;color:#d97706'>Series in Progress</span>`
          : `<span style='font-size:11px;font-weight:600;color:#94a3b8'>${g.time||'Upcoming'}</span>`;

        // Team row
        const teamRow = (team, tid, seed, won, lost, score, liveScore, side) => `
          <div style='display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid #f1f5f9'>
            ${seed ? `<span style='font-size:11px;font-weight:600;color:#94a3b8;min-width:14px;text-align:center'>${seed}</span>` : ''}
            <div style='width:32px;height:32px;border-radius:50%;background:${tid.gradient};display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:11px;color:#fff;flex-shrink:0'>${tid.mark}</div>
            <div style='flex:1;min-width:0'>
              <div style='font-size:14px;font-weight:${won?"800":lost?"500":"600"};color:${lost?"#94a3b8":"#111"}'>${team.name}</div>
            </div>
            ${isLive ? `
              <div style='display:flex;align-items:center;gap:5px'>
                <button onclick='adjustPlayoffScore(${ri},${gi},"${side}",-1)' style='width:26px;height:26px;border-radius:6px;background:#f1f5f9;border:1px solid #e2e8f0;font-size:13px;font-weight:700;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center'>−</button>
                <button onclick='adjustPlayoffScore(${ri},${gi},"${side}",1)' style='width:26px;height:26px;border-radius:6px;background:#f1f5f9;border:1px solid #e2e8f0;font-size:12px;font-weight:700;color:#374151;cursor:pointer'>+1</button>
                <button onclick='adjustPlayoffScore(${ri},${gi},"${side}",2)' style='width:26px;height:26px;border-radius:6px;background:#f1f5f9;border:1px solid #e2e8f0;font-size:12px;font-weight:700;color:#374151;cursor:pointer'>+2</button>
                <button onclick='adjustPlayoffScore(${ri},${gi},"${side}",3)' style='width:26px;height:26px;border-radius:6px;background:#f1f5f9;border:1px solid #e2e8f0;font-size:12px;font-weight:700;color:#374151;cursor:pointer'>+3</button>
                <span style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:24px;color:#dc2626;min-width:32px;text-align:right'>${liveScore??0}</span>
              </div>`
            : (isFinal||isLive) ? `
              <div style='display:flex;align-items:center;gap:6px'>
                ${won ? `<span style='font-size:14px;color:#94a3b8'>◄</span>` : ''}
                <span style='font-family:"Barlow Condensed",sans-serif;font-weight:${won?"900":"600"};font-size:22px;color:${lost?"#94a3b8":"#111"}'>${score??'–'}</span>
              </div>`
            : isBest3Game && played.length > 0 ? `
              <span style='font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:#94a3b8'>${team.id===g.home?sWinsH:sWinsA}</span>`
            : ''}
          </div>`;

        // Actions
        let actions = '';
        if (isFinal) {
          actions = `<div style='padding:8px 16px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end'>
            <button onclick='scorePlayoffGame(${ri},${gi})' style='padding:5px 12px;border-radius:7px;background:#f1f5f9;border:1px solid #e2e8f0;font-size:12px;font-weight:600;color:#374151;cursor:pointer'>✏️ Edit</button>
          </div>`;
        } else if (isLive) {
          actions = `<div style='padding:10px 16px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;gap:6px'>
            <button onclick='scorePlayoffGame(${ri},${gi})' style='padding:6px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0;font-size:12px;font-weight:600;color:#374151;cursor:pointer'>✏️ Edit</button>
            <button onclick='endPlayoffGame(${ri},${gi})' style='padding:6px 16px;border-radius:8px;background:#111;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer'>■ End Game</button>
          </div>`;
        } else if (isActive) {
          // Series in progress but no game currently live — show next game button
          actions = `<div style='padding:10px 16px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end'>
            <button onclick='startPlayoffGame(${ri},${gi})' style='padding:6px 16px;border-radius:8px;background:#16a34a;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer'>▶ Start Game ${gameNum}</button>
          </div>`;
        } else if (isUpcoming) {
          actions = `<div style='padding:10px 16px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end'>
            <button onclick='startPlayoffGame(${ri},${gi})' style='padding:6px 16px;border-radius:8px;background:#16a34a;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer'>▶ Start Game${isBest3Game?" 1":""}</button>
          </div>`;
        }

        // For isFlipped games, home/away display is from flipped perspective
        const displayHs = isLive ? (isFlipped ? g.as : g.hs) : g.hs;
        const displayAs = isLive ? (isFlipped ? g.hs : g.as) : g.as;

        return `<div style='background:#fff;border:1px solid ${isLive?"#fca5a5":"#e2e8f0"};border-radius:12px;overflow:hidden;box-shadow:${isLive?"0 0 0 2px rgba(239,68,68,.15),0 1px 4px rgba(0,0,0,.06)":"0 1px 4px rgba(0,0,0,.06)"}'>
          <div style='display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:${isLive?"#fff7f7":"#fafafa"};border-bottom:1px solid ${isLive?"#fecaca":"#f1f5f9"}'>
            ${statusLabel}
            ${seriesStatus ? `<span style='font-size:11px;font-weight:700;color:#1d4ed8'>${seriesStatus}</span>` : `<span style='font-size:11px;color:#94a3b8'>${g.court||''}</span>`}
          </div>
          ${teamRow(home, homeTid, hSeed, homeWon, awayWon, isFinal?(isFlipped?g.as:g.hs):null, displayHs, isFlipped?'as':'hs')}
          ${teamRow(away, awayTid, aSeed, awayWon, homeWon, isFinal?(isFlipped?g.hs:g.as):null, displayAs, isFlipped?'hs':'as')}
          ${played.length > 0 ? `<div style='padding:6px 16px;border-top:1px solid #f1f5f9;background:#fafafa'>
            ${played.map((pg, pgi) => {
              const pgFlipped = pgi % 2 === 1;
              const pgHomeId = pgFlipped ? g.away : g.home;
              const pgAwayId = pgFlipped ? g.home : g.away;
              const pgHome = l.teams.find(t=>t.id===pgHomeId);
              const pgAway = l.teams.find(t=>t.id===pgAwayId);
              const pgHs = pgFlipped ? pg.as : pg.hs;
              const pgAs = pgFlipped ? pg.hs : pg.as;
              const pgWon = pg.winner === pgHomeId;
              return `<div style='display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px'>
                <span style='color:#94a3b8;min-width:40px'>Gm ${pgi+1}</span>
                <span style='font-weight:${pgWon?700:500};color:${pgWon?"#111":"#94a3b8"};flex:1'>${pgHome?.name||'?'}</span>
                <span style='font-family:"Barlow Condensed",sans-serif;font-weight:700;color:#374151'>${pgHs}–${pgAs}</span>
                <span style='font-weight:${!pgWon?700:500};color:${!pgWon?"#111":"#94a3b8"};flex:1;text-align:right'>${pgAway?.name||'?'}</span>
              </div>`;
            }).join('')}
          </div>` : ''}
          ${actions}
        </div>`;
      }).join('');

      return `
        <div class='ph' style='margin-bottom:0;border-radius:var(--rx) var(--rx) 0 0'>
          <div style='display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px'>
            <div>
              <div style='font-size:10px;font-weight:800;color:rgba(245,158,11,.7);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:4px'>🏆 Playoff Mode</div>
              <div class='ph-title'>Playoff Schedule</div>
              <div class='ph-sub'>${pc.numTeams}-team · ${selRound.name}${champion ? ` · Champion: ${champion.name}` : ''}</div>
            </div>
            <button onclick="STATE.appTab='playoffs';R()" style='padding:6px 14px;border-radius:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);font-size:12px;font-weight:700;cursor:pointer'>View Bracket →</button>
          </div>
        </div>

        <div style='background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10'>
          <div style='display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid #f1f5f9'>
            ${roundPills}
          </div>
        </div>

        <div style='display:flex;flex-direction:column;gap:10px;padding:14px 18px 24px;background:#f8fafc;min-height:calc(100vh - 120px)'>
          ${gameCards}
        </div>`;
    }


    function renderPlayoffs() {
      const l = STATE.league;
      const pc = l.playoffConfig;
      if (!pc || !pc.bracket) {
        return `<div class='ph'><div class='ph-title'>Playoffs</div><div class='ph-sub'>The bracket hasn't been generated yet.</div></div><div class='empty-s'><h3>No bracket yet</h3><p>Commissioner needs to set up and activate Playoff Mode.</p></div>`;
      }
      const champion = l.teams.find(t => t.id === pc.champion);
      const identity = champion ? smartTeamIdentity(champion) : null;
      const seedMap = getPlayoffSeedMap(pc.bracket);
      const isBest3League = pc.format === 'best3';

      // Build one matchup card exactly like ESPN
      function matchupCard(g) {
        const home = l.teams.find(t => t.id === g.home);
        const away = l.teams.find(t => t.id === g.away);
        const isFinal = g.status === 'final';
        const isActive = g.status === 'active';
        const isBest3Game = g.format === 'best3';
        const hSeed = g.homeSeed || seedMap[g.home] || null;
        const aSeed = g.awaySeed || seedMap[g.away] || null;
        const sWinsH = isBest3Game ? ((g.seriesWins && g.seriesWins[g.home]) || 0) : 0;
        const sWinsA = isBest3Game ? ((g.seriesWins && g.seriesWins[g.away]) || 0) : 0;
        const seriesWinnerId = isBest3Game ? getSeriesWinner(g) : (isFinal ? g.winner : null);
        const gPlayedCount = isBest3Game ? (g.gamesPlayed?.length || 0) : 0;

        // Series/game status line (blue like ESPN)
        const isLive = g.status === 'live';
        let statusLine = '';
        if (!home && !away) {
          statusLine = '';
        } else if (isLive) {
          const gNum = isBest3Game ? (gPlayedCount + 1) : null;
          statusLine = `<div style='display:flex;align-items:center;gap:6px;padding:5px 12px;background:#fff7ed'>
            <span style='width:6px;height:6px;border-radius:50%;background:#ef4444;flex-shrink:0;animation:pulseDot 1.2s infinite'></span>
            <span style='font-size:11px;font-weight:700;color:#dc2626'>${isBest3Game ? `LIVE · Game ${gNum}` : 'LIVE'}</span>
          </div>`;
        } else if (isFinal && seriesWinnerId) {
          const winnerTeam = l.teams.find(t => t.id === seriesWinnerId);
          const wW = isBest3Game ? Math.max(sWinsH, sWinsA) : '';
          const lW = isBest3Game ? Math.min(sWinsH, sWinsA) : '';
          statusLine = `<div style='padding:5px 12px;font-size:11px;font-weight:700;color:#1d4ed8'>${winnerTeam?.name||''} wins${isBest3Game ? ` series ${wW}-${lW}` : ''}</div>`;
        } else if (isBest3Game && gPlayedCount > 0 && !isFinal) {
          const leadText = sWinsH === sWinsA
            ? `Game ${gPlayedCount+1}, Series tied ${sWinsH}-${sWinsA}`
            : `Game ${gPlayedCount+1}, ${sWinsH > sWinsA ? home?.name||'' : away?.name||''} leads ${Math.max(sWinsH,sWinsA)}-${Math.min(sWinsH,sWinsA)}`;
          statusLine = `<div style='padding:5px 12px;font-size:11px;font-weight:700;color:#1d4ed8'>${leadText}</div>`;
        } else if (isBest3Game) {
          statusLine = `<div style='padding:5px 12px;font-size:11px;font-weight:600;color:#94a3b8'>Best of 3</div>`;
        }

        // Team row — ESPN style
        const teamRow = (team, seed, won, lost, score) => {
          if (!team) {
            return `<div style='display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid #f1f5f9'>
              <div style='width:24px;height:24px;border-radius:50%;background:#e2e8f0;flex-shrink:0'></div>
              <span style='font-size:13px;color:#94a3b8'>TBD</span>
            </div>`;
          }
          const tid = smartTeamIdentity(team);
          const isLiveGame = g.status === 'live';
          const scoreDisplay = isLiveGame
            ? (score ?? 0)
            : isBest3Game
            ? (isFinal || isActive || gPlayedCount > 0 ? (team.id === g.home ? sWinsH : sWinsA) : '')
            : (isFinal ? (score ?? '') : '');
          return `<div style='display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid #f1f5f9;background:${won?"#f0fdf4":isLiveGame?"#fff7ed":"#fff"}'>
            ${seed ? `<span style='font-size:11px;font-weight:600;color:#94a3b8;min-width:12px;text-align:center'>${seed}</span>` : ''}
            <div style='width:24px;height:24px;border-radius:50%;background:${tid.gradient};display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:9px;color:#fff;flex-shrink:0'>${tid.mark}</div>
            <span style='font-size:13px;font-weight:${won?"800":"500"};color:${lost?"#94a3b8":won?"#111":"#374151"};flex:1'>${team.name}</span>
            ${won ? `<span style='font-size:14px;color:#94a3b8;margin-right:2px'>◄</span>` : ''}
            <span style='font-family:"Barlow Condensed",sans-serif;font-weight:${won?"900":"600"};font-size:16px;color:${isLiveGame?"#dc2626":won?"#111":lost?"#94a3b8":"#374151"};min-width:24px;text-align:right'>${scoreDisplay}</span>
          </div>`;
        };

        const homeWon = isFinal && g.winner === g.home;
        const awayWon = isFinal && g.winner === g.away;

        return `<div style='background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:10px;min-width:180px'>
          ${statusLine}
          ${teamRow(home, hSeed, homeWon, awayWon, g.hs)}
          ${teamRow(away, aSeed, awayWon, homeWon, g.as)}
        </div>`;
      }

      // Build rounds as columns
      const roundCols = pc.bracket.map((round, ri) => {
        const cards = round.games.map(g => matchupCard(g)).join('');
        return `<div style='flex:1;min-width:190px;max-width:260px'>
          <div style='font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center'>${round.name}</div>
          <div style='display:flex;flex-direction:column;justify-content:space-around;height:100%'>${cards}</div>
        </div>`;
      });

      // Connectors between rounds
      const cols = [];
      roundCols.forEach((col, i) => {
        cols.push(col);
        if (i < roundCols.length - 1) {
          cols.push(`<div style='display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4px;min-width:20px'>
            <div style='width:16px;height:1px;background:#e2e8f0'></div>
          </div>`);
        }
      });

      return `
        <div style='background:linear-gradient(135deg,#0c0900,#1a1100,#0c0900);padding:16px 18px;margin:14px 18px 0;border-radius:var(--rx);border:1px solid rgba(245,158,11,.15);position:relative;overflow:hidden'>
          <div style='position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(245,158,11,.08),transparent 70%);pointer-events:none'></div>
          <div style='position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px'>
            <div>
              <div style='font-size:10px;font-weight:800;color:rgba(245,158,11,.7);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px'>🏆 Playoff Mode</div>
              <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:32px;color:#fff;letter-spacing:-.5px;line-height:1'>${l.name}</div>
              <div style='font-size:11px;color:rgba(255,255,255,.4);margin-top:3px'>${pc.numTeams}-team · ${isBest3League ? "Best of 3" : "Single Elimination"}</div>
            </div>
            ${champion ? `<div style='background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);border-radius:14px;padding:12px 16px;text-align:center'>
              <div style='font-size:9px;font-weight:800;color:#f59e0b;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px'>Champion</div>
              <div style='display:flex;align-items:center;gap:8px'>
                <div style='width:36px;height:36px;border-radius:50%;background:${identity.gradient};display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:13px;color:#fff'>${identity.mark}</div>
                <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:22px;color:#f59e0b'>${champion.name}</div>
              </div>
            </div>` : ''}
          </div>
        </div>
        <div style='padding:16px 18px 24px;overflow-x:auto;-webkit-overflow-scrolling:touch'>
          <div style='display:flex;gap:0;align-items:flex-start;min-width:fit-content'>
            ${cols.join('')}
          </div>
        </div>`;
    }


async function assignCaptain(playerId, teamId) {
      const l = STATE.league;
      const player = l.players.find(p => p.id === playerId);
      const team = l.teams.find(t => t.id === teamId);
      if (!player || !team) return;
      await sb.from('league_members').update({ role: 'captain', team_id: teamId })
        .eq('league_id', l.id).eq('user_id', player.userId || player.id);
      l.teams = l.teams.map(t => t.id === teamId ? { ...t, captainId: playerId, captainName: player.name } : t);
      l.players = l.players.map(p => p.id === playerId ? { ...p, isCaptain: true, captainTeamId: teamId } : p);
      await saveState();
      closeModal();
      R();
    }

    async function removeCaptain(playerId) {
      const l = STATE.league;
      const player = l.players.find(p => p.id === playerId);
      if (!player) return;
      await sb.from('league_members').update({ role: 'player', team_id: null })
        .eq('league_id', l.id).eq('user_id', player.userId || player.id);
      l.teams = l.teams.map(t => t.captainId === playerId ? { ...t, captainId: null, captainName: null } : t);
      l.players = l.players.map(p => p.id === playerId ? { ...p, isCaptain: false, captainTeamId: null } : p);
      await saveState();
      R();
    }

    function openAssignCaptain(playerId) {
      const l = STATE.league;
      const player = l.players.find(p => p.id === playerId);
      if (!player) return;
      const availableTeams = l.teams.filter(t => !t.captainId);
      if (!availableTeams.length) {
        openModal('No Teams Available',
          `<div style='text-align:center;padding:8px'><div style='font-size:32px;margin-bottom:8px'>⚠️</div><div style='font-size:14px;color:var(--t2)'>All teams already have captains assigned.</div></div>`,
          `<button class='btn btn-p btn-sm' onclick='closeModal()'>OK</button>`);
        return;
      }
      openModal('Assign Captain',
        `<div style='padding:4px 0'>
          <div style='font-size:14px;font-weight:700;color:var(--t1);margin-bottom:4px'>${player.name}</div>
          <div style='font-size:12px;color:var(--t2);margin-bottom:16px'>${player.skill ? '★'+player.skill+' · ' : ''}Select a team to captain</div>
          <div style='display:flex;flex-direction:column;gap:8px'>
            ${availableTeams.map(t => `
              <button onclick='assignCaptain("${playerId}","${t.id}")' style='display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border:1.5px solid var(--b1);border-radius:10px;cursor:pointer;text-align:left;width:100%'>
                <div style='width:32px;height:32px;border-radius:50%;background:${t.color};flex-shrink:0'></div>
                <div>
                  <div style='font-size:13px;font-weight:700;color:var(--t1)'>${t.name||'Unnamed Team'}</div>
                  <div style='font-size:11px;color:var(--t3)'>No captain yet</div>
                </div>
              </button>`).join('')}
          </div>
        </div>`,
        `<button class='btn btn-gh btn-sm' onclick='closeModal()'>Cancel</button>`
      );
    }

    function renderCommTodaysGames(l) {
      const todayGames = l.games.filter(g => g.gameNum === (l.currentDayGameNum || 1));
      const postponedGames = l.games.filter(g => g.status === 'postponed');
      if (!todayGames.length && !postponedGames.length) return '';
      const gameRows = todayGames.map(g => {
        const home = l.teams.find(t => t.id === g.home);
        const away = l.teams.find(t => t.id === g.away);
        const isFinal = g.status === 'final';
        const isLive = g.status === 'live';
        const isPostponed = g.status === 'postponed';
        let actions = '';
        if (isFinal) {
          actions = `<span style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:16px;color:var(--t1)'>${g.hs}–${g.as}</span>
            <span style='font-size:10px;font-weight:700;color:var(--gd);background:var(--gm);padding:2px 7px;border-radius:999px'>Final</span>
            <button class='btn btn-o btn-xs' onclick='scoreGame("${g.id}")'>Edit</button>`;
        } else if (isLive) {
          actions = `<span style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:16px;color:var(--red)'>${g.hs}–${g.as}</span>
            <span style='font-size:10px;font-weight:700;color:var(--red);background:rgba(239,68,68,.08);padding:2px 7px;border-radius:999px'>🔴 Live</span>
            <button class='btn btn-p btn-xs' onclick='scoreGame("${g.id}")'>Update</button>`;
        } else if (isPostponed) {
          actions = `<span style='font-size:10px;font-weight:700;color:#f59e0b;background:rgba(245,158,11,.1);padding:2px 7px;border-radius:999px'>⏸ Postponed</span>
            <button class='btn btn-o btn-xs' onclick='reinstateGame("${g.id}")'>Reinstate</button>`;
        } else {
          actions = `<button class='btn btn-p btn-xs' onclick='scoreGame("${g.id}")'>Score</button>
            <button class='btn btn-o btn-xs' style='color:#f59e0b;border-color:#f59e0b' onclick='postponeGame("${g.id}")'>Postpone</button>
            <button class='btn btn-o btn-xs' style='color:var(--red);border-color:var(--red)' onclick='openForfeitModal("${g.id}")'>Forfeit</button>`;
        }
        return `<div style='display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--b1)'>
          <div style='flex:1;min-width:0'>
            <div style='font-size:13px;font-weight:700;color:var(--t1)'>${home?.name||'?'} <span style='color:var(--t3);font-weight:500'>vs</span> ${away?.name||'?'}</div>
            <div style='font-size:10px;color:var(--t3);margin-top:2px'>${g.court||''} · ${g.time||''}</div>
          </div>
          <div style='display:flex;align-items:center;gap:6px'>${actions}</div>
        </div>`;
      }).join('');
      let postponedRows = '';
      if (postponedGames.length) {
        const pRows = postponedGames.map(g => {
          const home = l.teams.find(t => t.id === g.home);
          const away = l.teams.find(t => t.id === g.away);
          const label = g.rescheduledTo === 'tbd' ? ' <span style="font-size:10px;color:#f59e0b">(TBD)</span>'
            : g.rescheduledTo ? ` <span style="font-size:10px;color:var(--t3)">→ Day ${g.rescheduledTo}</span>` : '';
          return `<div style='display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(245,158,11,.1)'>
            <span style='font-size:12px;font-weight:600;color:var(--t2)'>${home?.name||'?'} vs ${away?.name||'?'}${label}</span>
            <div style='display:flex;gap:5px'>
              <button class='btn btn-o btn-xs' onclick='reinstateGame("${g.id}")'>Reinstate</button>
              <button class='btn btn-o btn-xs' style='color:#f59e0b;border-color:#f59e0b' onclick='postponeGame("${g.id}")'>Reschedule</button>
            </div>
          </div>`;
        }).join('');
        postponedRows = `<div style='padding:10px 16px;background:rgba(245,158,11,.04);border-top:1px solid rgba(245,158,11,.15)'>
          <div style='font-size:10px;font-weight:800;color:#b45309;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px'>⏸ Postponed — Needs Rescheduling (${postponedGames.length})</div>
          ${pRows}
        </div>`;
      }
      return `<div class='cc' style='margin-top:14px'>
        <div class='cc-hd'><div class='cc-icon'>🏀</div><h3>Today's Games</h3><span class='badge bg-gray'>Day ${l.currentDayGameNum||1}</span></div>
        <div class='cc-bd' style='padding:0'>${gameRows}${postponedRows}</div>
      </div>`;
    }

    function renderComm() {
          const l = STATE.league;
          if (!l) return '';
          const open = STATE.commOpen || {};
    
          // ── section toggle helper ──
          function tog(key) {
            return `STATE.commOpen={...STATE.commOpen||{},${key}:!((STATE.commOpen||{}).${key})};R()`;
          }
    
          // ── section wrapper ──

    function addCommGameDay() {
      const l = STATE.league;
      const n = l.gameDays.length ? Math.max(...l.gameDays.map(g => g.num)) + 1 : 1;
      const last = l.gameDays.at(-1);
      const courts = last?.courts?.length ? [...last.courts] : l.courts.filter(Boolean);
      const time = last?.time || '2:00 PM';
      l.gameDays.push({ num: n, time, courts });
      l.gameDays.forEach((g, i) => g.num = i + 1);
      // Pre-fill games using next round-robin round
      const rounds = buildRR(l.teams.map(t => t.id));
      const newDayNum = l.gameDays.at(-1).num;
      const usedRounds = l.gameDays.length - 1; // how many days existed before
      const round = rounds[usedRounds % rounds.length] || [];
      round.forEach((pair, pi) => {
        const flip = Math.random() > .5;
        l.games.push({
          id: uid(), gameNum: newDayNum,
          home: flip ? pair[0] : pair[1],
          away: flip ? pair[1] : pair[0],
          court: courts[pi % courts.length] || courts[0],
          time, hs: null, as: null, status: 'upcoming'
        });
      });
      STATE.commSchedDay = newDayNum;
      saveState();
      R();
    }

    function removeCommGameDay(dayNum) {
      const l = STATE.league;
      const dayGames = l.games.filter(g => g.gameNum === dayNum);
      const hasScores = dayGames.some(g => g.status === 'final' || g.status === 'live');
      const doRemove = () => {
        l.games = l.games.filter(g => g.gameNum !== dayNum);
        l.gameDays = l.gameDays.filter(d => d.num !== dayNum);
        l.gameDays.forEach((d, i) => {
          const oldNum = d.num;
          d.num = i + 1;
          l.games.filter(g => g.gameNum === oldNum).forEach(g => g.gameNum = i + 1);
        });
        if (l.currentDayGameNum > l.gameDays.length) l.currentDayGameNum = l.gameDays.length || 1;
        STATE.commSchedDay = l.gameDays[0]?.num || 1;
        saveState();
        R();
      };
      if (hasScores) {
        openModal('Remove Game Day?',
          `<div style='font-size:13px;color:var(--t2);line-height:1.6'>Game Day ${dayNum} has scored games. Removing it will delete those results permanently.</div>`,
          `<button class='btn btn-gh btn-sm' onclick='closeModal()'>Cancel</button>
           <button class='btn btn-sm' style='background:#dc2626;color:#fff;border:none' onclick='closeModal();removeCommGameDayConfirmed(${dayNum})'>Remove Anyway</button>`
        );
      } else {
        doRemove();
      }
    }
    function removeCommGameDayConfirmed(dayNum) {
      const l = STATE.league;
      l.games = l.games.filter(g => g.gameNum !== dayNum);
      l.gameDays = l.gameDays.filter(d => d.num !== dayNum);
      l.gameDays.forEach((d, i) => {
        const oldNum = d.num;

        l.games.filter(g => g.gameNum === oldNum).forEach(g => g.gameNum = i + 1);

      if (l.currentDayGameNum > l.gameDays.length) l.currentDayGameNum = l.gameDays.length || 1;

    function addPlayerForS2() {
      const input = document.getElementById('newS2Player');

    function startSeason2() {
      const l = STATE.league;
      const keepRosters = STATE.s2KeepRosters;

      // Archive current season data onto the league
      if (!l.seasonHistory) l.seasonHistory = [];
      l.seasonHistory.push({
        season: (l.seasonHistory.length || 0) + 1,
        year: new Date().getFullYear(),
        champion: l.playoffConfig?.champion,
        standings: getStandingsRows(l).map(r => ({ teamId: r.team.id, name: r.team.name, w: r.w, l: r.l })),
        games: l.games.length,
        trades: (l.tradeLog||[]).length,
      });

      // Save game days template before reset (courts + times)
      const savedGameDays = (l.gameDays||[]).map(gd => ({ ...gd, num: gd.num }));

      // Reset for new season
      l.games         = [];
      l.gameDays      = savedGameDays; // keep same schedule structure
      l.draftState    = null;
      l.playoffConfig = null;
      l.status        = 'lobby';
      l.seasonEntered = false;
      l.currentDayGameNum = 1;
      l.lastCompletedDayGameNum = null;
      l.gameOfDayByDay = {};
      l.forfeitLog    = [];
      l.tradeLog      = [];

      // Handle rosters
      if (keepRosters) {
        // Keep rosters — skip draft entirely, go straight to season
        l.status = 'season';
        l.seasonEntered = true;
        l.players = l.players.map(p => ({ ...p }));
      } else {
        // Redraft — players back to pool
        l.players = l.players.map(p => ({ ...p, teamId: null }));
        l.status = 'lobby';
      }

      // Auto-generate schedule using saved game days
      if (savedGameDays.length > 0) {
        l.games = buildSchedule(l);
      }

      // Reset STATE
      STATE.showRecap      = false;
      STATE.showChampCard  = false;
      STATE.showNextSeason = false;
      STATE.s2KeepRosters  = undefined;
      STATE.appTab         = keepRosters ? 'home' : 'commissioner';
      STATE.commTab        = 'league';

      saveState();
      R();
    }

    function doArchiveSeason() {
      const l = STATE.league;
      if (!l.seasonHistory) l.seasonHistory = [];
      l.seasonHistory.push({
        season: (l.seasonHistory.length||0) + 1,
        year: new Date().getFullYear(),
        champion: l.playoffConfig?.champion,
        standings: getStandingsRows(l).map(r => ({ teamId: r.team.id, name: r.team.name, w: r.w, l: r.l })),
        games: l.games.length,
        trades: (l.tradeLog||[]).length,
      });
      // Full reset — players back to pool
      l.games = []; l.gameDays = []; l.draftState = null; l.playoffConfig = null;
      l.status = 'lobby'; l.seasonEntered = false;
      l.currentDayGameNum = 1; l.lastCompletedDayGameNum = null;
      l.gameOfDayByDay = {}; l.forfeitLog = []; l.tradeLog = [];
      l.players = l.players.map(p => ({ ...p, teamId: null }));
      STATE.showRecap = false; STATE.showChampCard = false;
      STATE.showNextSeason = false; STATE.s2KeepRosters = undefined;
      STATE.appTab = 'commissioner'; STATE.commTab = 'league';
      saveState(); R();

      const isPlayoffs = l.status === 'playoffs' || l.status === 'complete';
      const isCommissioner = STATE.role === 'commissioner';
      const captainTid = STATE.captainTeamId;
      const currentDay = l.currentDayGameNum || 1;

      // Get today's games
      let games = [];
      if (isPlayoffs) {
        const pc = l.playoffConfig;
        if (pc?.bracket) {
          // Find first round with non-final games
          for (const round of pc.bracket) {
            const rGames = round.games.filter(g => g.home && g.away);
            if (rGames.some(g => g.status !== 'final')) {
              games = rGames.map((g, gi) => ({
                ...g,
                roundName: round.name,
                roundIdx: pc.bracket.indexOf(round),
                gameIdx: gi,
                isPlayoff: true
              }));
              break;
            }
          }
        }
      } else {
        games = l.games
          .filter(g => g.gameNum === currentDay)
          .map(g => ({ ...g, isPlayoff: false }));
      }

      const totalGames  = games.length;
      const finalGames  = games.filter(g => g.status === 'final').length;
      const liveGames   = games.filter(g => g.status === 'live').length;
      const allDone     = totalGames > 0 && finalGames === totalGames;

      // Sort — captain's game first, then live, then upcoming, then final
      const sorted = [...games].sort((a, b) => {
        const aIsMine = captainTid && (a.home === captainTid || a.away === captainTid);
        const bIsMine = captainTid && (b.home === captainTid || b.away === captainTid);
        if (aIsMine && !bIsMine) return -1;
        if (!aIsMine && bIsMine) return 1;
        const order = { live: 0, upcoming: 1, final: 2 };
        return (order[a.status] ?? 1) - (order[b.status] ?? 1);
      });

      const gameCards = sorted.map(g => {
        const home     = l.teams.find(t => t.id === g.home);
        const away     = l.teams.find(t => t.id === g.away);
        if (!home || !away) return '';
        const homeId   = smartTeamIdentity(home);
        const awayId   = smartTeamIdentity(away);
        const isFinal  = g.status === 'final';
        const isLive   = g.status === 'live';
        const homeWon  = isFinal && (g.hs||0) > (g.as||0);
        const awayWon  = isFinal && (g.as||0) > (g.hs||0);
        const isMine   = captainTid && (g.home === captainTid || g.away === captainTid);
        const canScore = isCommissioner || isMine;
        const scoreFunc = g.isPlayoff
          ? `scorePlayoffGame(${g.roundIdx},${g.gameIdx})`
          : `scoreGame('${g.id}')`;

        return `<div style='background:#fff;border-radius:20px;overflow:hidden;box-shadow:${isLive?"0 0 0 3px rgba(239,68,68,.2),0 8px 32px rgba(0,0,0,.12)":"0 4px 20px rgba(0,0,0,.08)"};border:2px solid ${isLive?"rgba(239,68,68,.4)":isMine&&!isFinal?"rgba(139,92,246,.3)":"transparent"};margin-bottom:14px'>
          <!-- Game header -->
          <div style='display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:${isLive?"rgba(239,68,68,.06)":isMine&&!isFinal?"rgba(139,92,246,.05)":"var(--f4)"};border-bottom:1px solid ${isLive?"rgba(239,68,68,.15)":"var(--b1)"}'>
            <div style='display:flex;align-items:center;gap:8px'>
              ${isLive ? `<span style='display:inline-flex;align-items:center;gap:5px;background:rgba(239,68,68,.15);color:#dc2626;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px'><span style='width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulseDot 1.2s infinite'></span>LIVE</span>` : ''}
              ${isFinal ? `<span style='background:rgba(22,163,74,.1);color:var(--gd);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px'>✓ Final</span>` : ''}
              ${!isLive && !isFinal ? `<span style='background:rgba(255,255,255,.8);color:var(--t2);font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--b1)'>${g.time||'Upcoming'}</span>` : ''}
              ${isMine && !isFinal ? `<span style='background:rgba(139,92,246,.1);color:#7c3aed;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px'>Your Game</span>` : ''}
              ${g.roundName ? `<span style='font-size:11px;color:rgba(245,158,11,.8);font-weight:700'>${g.roundName}</span>` : g.court ? `<span style='font-size:11px;color:var(--t3)'>📍 ${g.court}</span>` : ''}
            </div>
            ${canScore && !isFinal ? `<button onclick='${scoreFunc}' style='padding:8px 18px;border-radius:999px;background:${isLive?"#dc2626":"var(--g)"};color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;min-height:40px'>${isLive?'Update Score':'+ Score'}</button>` : ''}
            ${canScore && isFinal ? `<button onclick='${scoreFunc}' style='padding:6px 14px;border-radius:999px;background:transparent;color:var(--t3);border:1px solid var(--b1);font-size:12px;font-weight:600;cursor:pointer'>✏️ Edit</button>` : ''}
          </div>

          <!-- Teams and score -->
          <div style='padding:20px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px'>
            <!-- Home -->
            <div style='display:flex;align-items:center;gap:12px;opacity:${awayWon?"0.4":"1"}'>
              <div style='width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:18px;color:#fff;background:${homeId.gradient};flex-shrink:0;${homeWon?"box-shadow:0 0 0 3px "+home.color+"44":""}'>${homeId.mark}</div>
              <div>
                <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:22px;color:var(--t1);line-height:1'>${home.name}</div>
                <div style='font-size:11px;color:var(--t3);margin-top:2px'>Home${homeWon?" · Winner":""}</div>
              </div>
            </div>

            <!-- Score -->
            <div style='text-align:center;min-width:80px'>
              ${isFinal || isLive ? `
                <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:48px;line-height:1;letter-spacing:-2px;color:var(--t1)'>
                  <span style='color:${homeWon?"var(--t1)":isFinal?"var(--t4)":"var(--t1)"}'>${g.hs??0}</span>
                  <span style='color:var(--b2);font-size:28px'>·</span>
                  <span style='color:${awayWon?"var(--t1)":isFinal?"var(--t4)":"var(--t1)"}'>${g.as??0}</span>
                </div>
                ${isLive ? `<div style='font-size:10px;font-weight:700;color:#dc2626;letter-spacing:1px;margin-top:4px'>IN PROGRESS</div>` : ''}
              ` : `<div style='font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:var(--t3)'>VS</div>`}
            </div>

            <!-- Away -->
            <div style='display:flex;align-items:center;gap:12px;justify-content:flex-end;text-align:right;opacity:${homeWon?"0.4":"1"}'>
              <div>
                <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:22px;color:var(--t1);line-height:1'>${away.name}</div>
                <div style='font-size:11px;color:var(--t3);margin-top:2px'>${awayWon?"Winner · ":""}Away</div>
              </div>
              <div style='width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:18px;color:#fff;background:${awayId.gradient};flex-shrink:0;${awayWon?"box-shadow:0 0 0 3px "+away.color+"44":""}'>${awayId.mark}</div>
            </div>
          </div>
        </div>`;
      }).join('');

      return `
        <!-- Game Day Mode overlay -->
        <div style='position:fixed;inset:0;background:var(--f8);z-index:100;display:flex;flex-direction:column;overflow:hidden'>
          <!-- Header -->
          <div style='background:var(--n1);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)'>
            <div>
              <div style='font-size:10px;font-weight:800;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px'>${isPlayoffs?"🏆 Playoff Mode":"🏀 Game Day Mode"}</div>
              <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:26px;color:#fff;line-height:1'>${isPlayoffs?"Playoff Games":"Game Day ${currentDay}"}</div>
            </div>
            <div style='display:flex;align-items:center;gap:8px'>
              ${liveGames > 0 ? `<span style='display:flex;align-items:center;gap:5px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#f87171;font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px'><span style='width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulseDot 1.2s infinite'></span>${liveGames} Live</span>` : ''}
              <button onclick='STATE.gameDayMode=false;R()' style='padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:12px;font-weight:700;cursor:pointer'>✕ Exit</button>
            </div>
          </div>

          <!-- Progress bar -->
          <div style='background:var(--n1);padding:10px 18px 14px;flex-shrink:0'>
            <div style='display:flex;justify-content:space-between;margin-bottom:6px'>
              <span style='font-size:11px;font-weight:600;color:rgba(255,255,255,.5)'>${finalGames} of ${totalGames} games complete</span>
              ${allDone ? `<span style='font-size:11px;font-weight:700;color:#4ade80'>✓ All done!</span>` : `<span style='font-size:11px;font-weight:600;color:rgba(255,255,255,.4)'>${totalGames - finalGames} remaining</span>`}
            </div>
            <div style='height:4px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden'>
              <div style='height:100%;width:${totalGames?Math.round(finalGames/totalGames*100):0}%;background:linear-gradient(90deg,#16a34a,#4ade80);border-radius:999px;transition:width .4s'></div>
            </div>
          </div>

          <!-- Games scroll area -->
          <div style='flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px'>
            ${gameCards || '<div style="text-align:center;padding:40px;color:var(--t3)"><div style="font-size:32px;margin-bottom:12px">🏀</div><div style="font-size:14px;font-weight:600">No games scheduled for today</div></div>'}
            ${allDone && !isPlayoffs ? `
            <div style='background:linear-gradient(135deg,#052e16,#14532d);border-radius:20px;padding:20px;text-align:center;margin-top:8px'>
              <div style='font-size:24px;margin-bottom:8px'>🎉</div>
              <div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:24px;color:#fff'>Game Day ${currentDay} Complete!</div>
              ${currentDay < (l.gameDays?.length||0) ? `<button onclick='commissionerAdvanceDay();STATE.gameDayMode=false;R()' style='margin-top:12px;padding:10px 24px;border-radius:999px;background:#16a34a;color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer'>Advance to Day ${currentDay+1} →</button>` : `<div style='font-size:13px;color:rgba(255,255,255,.6);margin-top:8px'>Regular season complete</div>`}
            </div>` : ''}
          </div>
        </div>`;
    }


    function renderMainApp() { const l = STATE.league; if (!l) { STATE.screen = 'landing'; return renderLanding(); } const isDraftLive = l?.draftState?.status === 'active'; const isPlayoffs = l.status === 'playoffs' || l.status === 'complete';
      const tabs = [{k:'home',lb:'Home'},{k:'standings',lb:'Standings'},{k:'schedule',lb:'Schedule'},{k:'rosters',lb:'Rosters'},...(isPlayoffs ? [{k:'playoffs',lb:'🏆 Playoffs',cls:'live'}] : l.status === 'season' ? [] : [{k:'draft',lb:isDraftLive?'🟢 Draft Room':'Draft Room',cls:isDraftLive?'live':''}]),{k:'commissioner',lb:'Commissioner'}]; const nav = `<div class='nav'><div style='display:flex;align-items:center;gap:0;flex:1;overflow:hidden'><div style='display:flex;align-items:center;flex-shrink:0;cursor:pointer' onclick="STATE.screen='landing';R()"><span class='logo-mark'>RYL</span></div><span style='color:rgba(255,255,255,.18);font-size:13px;margin:0 7px'>/</span><div class='league-switcher-root' style='position:relative;margin-right:8px'>
        <button onclick="STATE.showLeagueSwitcher=!STATE.showLeagueSwitcher;R()" style='display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 10px;cursor:pointer;max-width:130px'>
          <span style='font-size:11px;font-weight:700;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px'>${l.name||'My League'}</span>
          <span style='color:rgba(255,255,255,.4);font-size:10px;flex-shrink:0'>${STATE.showLeagueSwitcher?'▲':'▼'}</span>
        </button>
      </div><div class='nav-tabs'>${tabs.map(t => `<button class='ntab ${STATE.appTab===t.k?'on':''} ${t.cls||''}' onclick="STATE.appTab='${t.k}';STATE.rosterFocus=null;STATE.draftRecap=false;R()">${t.lb}</button>`).join('')}</div></div><div class='nav-right' style='display:flex;align-items:center;gap:8px'>
        ${STATE.user ? `<button onclick='signOut()' style='background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer' title='Sign out'>↩</button>` : ''}
            <span style='background:${(l.seasonHistory||[]).length>0?"rgba(245,158,11,.15)":"rgba(255,255,255,.07)"};border:1px solid ${(l.seasonHistory||[]).length>0?"rgba(245,158,11,.3)":"rgba(255,255,255,.1)"};color:${(l.seasonHistory||[]).length>0?"#f59e0b":"rgba(255,255,255,.4)"};font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px'>
              S${((l.seasonHistory||[]).length||0)+1}
            </span>
            ${l.status === 'complete' ? `<button onclick='STATE.showRecap=true;R()' style='display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:#f59e0b;font-size:11px;font-weight:700;cursor:pointer'>📋 Recap</button>` : ''}


          </div></div>`; const leagueSwitcherDropdown = STATE.showLeagueSwitcher ? `
        <div class='league-switcher-root' style='position:fixed;top:52px;left:0;min-width:240px;background:#fff;border:1.5px solid var(--b1);border-radius:0 0 16px 16px;box-shadow:var(--sh3);z-index:9999;overflow:hidden'>
          <div style='padding:8px 14px 6px;font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--b1)'>Your Leagues</div>
          ${STATE.leagues.map(lg => `
            <div style='display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--b1);background:${lg.id===STATE.activeLeagueId?"var(--gm)":"#fff"}'>
              <div style='flex:1;min-width:0'>
                <div style='font-size:13px;font-weight:700;color:${lg.id===STATE.activeLeagueId?"var(--gd)":"var(--t1)"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>${lg.name||'Unnamed League'}</div>
                <div style='font-size:10px;color:var(--t3);margin-top:1px'>${lg.status==='lobby'?'⚙️ Setup':lg.status==='season'?'🟢 Season Active':lg.status==='playoffs'?'🏆 Playoffs':lg.status==='complete'?'✅ Complete':'📋 Draft'}</div>
              </div>
              ${lg.id===STATE.activeLeagueId
                ? `<span style='font-size:10px;font-weight:700;color:var(--gd);background:var(--gm);padding:2px 8px;border-radius:999px;flex-shrink:0'>Active</span>`
                : `<button onclick="STATE.showLeagueSwitcher=false;switchLeague('${lg.id}')" style='font-size:11px;font-weight:700;color:var(--g);background:var(--gm);border:1px solid rgba(22,163,74,.3);border-radius:7px;padding:5px 12px;cursor:pointer;flex-shrink:0'>Switch</button>`
              }
              <button onclick="confirmDeleteLeague('${lg.id}')" style='font-size:13px;color:var(--red);background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:7px;padding:4px 8px;cursor:pointer;flex-shrink:0' title='Delete league'>🗑</button>
            </div>`).join('')}
          <div style='padding:10px 14px;border-bottom:1px solid var(--b1)'>
            <button onclick="STATE.showLeagueSwitcher=false;createNewLeague()" style='width:100%;padding:9px;background:var(--gm);color:var(--gd);border:1.5px dashed rgba(22,163,74,.4);border-radius:10px;font-size:12px;font-weight:700;cursor:pointer'>+ Create New League</button>
          </div>
          <div style='padding:10px 14px;display:flex;gap:8px'>
            <button onclick="exportLeague(STATE.activeLeagueId)" style='flex:1;padding:7px;background:var(--f4);color:var(--t2);border:1px solid var(--b1);border-radius:8px;font-size:11px;font-weight:700;cursor:pointer'>⬇ Export Backup</button>
            <button onclick="importLeague()" style='flex:1;padding:7px;background:var(--f4);color:var(--t2);border:1px solid var(--b1);border-radius:8px;font-size:11px;font-weight:700;cursor:pointer'>⬆ Import Backup</button>
          </div>
        </div>` : '';
      let content = ''; if (STATE.showChampCard) return nav + leagueSwitcherDropdown + renderChampionCard();
      if (STATE.showRecap) return nav + leagueSwitcherDropdown + renderSeasonRecap();
       if (l.status === 'transition') content = renderTransition(); else if (l.status === 'lobby' && STATE.appTab !== 'commissioner') content = renderLobby(); else if (STATE.appTab === 'home') content = l.status === 'lobby' ? renderLobby() : renderHome(); else if (STATE.appTab === 'standings') content = renderStandings(); else if (STATE.appTab === 'schedule') content = renderSchedule(); else if (STATE.appTab === 'rosters') content = renderRosters(); else if (STATE.appTab === 'draft') content = renderDraft(); else if (STATE.appTab === 'playoffs') content = renderPlayoffs(); else if (STATE.appTab === 'commissioner') content = renderComm(); return `<div>${nav}${leagueSwitcherDropdown}${content}${STATE.modal ? renderModal() : ''}</div>`; }
    function renderApp() {
      if (STATE.authLoading) return `<div style='min-height:100vh;background:#07110b;display:flex;align-items:center;justify-content:center'><div style='font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:32px;color:rgba(255,255,255,.3)'>RYL</div></div>`;
      if (STATE.screen === 'confirm_email') return renderConfirmEmail();
      if (STATE.screen === 'auth' || STATE.screen === 'signup') return renderAuth();
      if (STATE.screen === 'join' && STATE.user) return renderJoin();
      // Role-based routing
      if (STATE.screen === 'app' && STATE.league) {
        if (STATE.justJoined) return renderJoinSuccess();
        if (STATE.memberRole === 'captain') {
          if (STATE.appTab === 'home' || !STATE.appTab) return renderCaptainNav() + renderCaptainHome();
          if (STATE.appTab === 'standings') return renderCaptainNav() + renderStandings();
          if (STATE.appTab === 'schedule') return renderCaptainNav() + renderSchedule();
          if (STATE.appTab === 'rosters') return renderCaptainNav() + renderRosters();
          return renderCaptainNav() + renderCaptainHome();
        }
        if (STATE.memberRole === 'player') {
          const draftDone = STATE.league.draftState?.status === 'done' || STATE.league.status === 'season' || STATE.league.status === 'playoffs' || STATE.league.status === 'complete';
          if (!draftDone) return renderWaiting();
          // After draft — fall through to normal tabs
        }
      } if (STATE.screen === 'landing') return renderLanding(); if (STATE.screen === 'wizard') return renderWizard(); if (STATE.screen === 'join') return renderJoin(); if (STATE.screen === 'app') return renderMainApp(); return renderLanding(); }
    document.addEventListener('click', (e) => {
      if (STATE.showLeagueSwitcher && !e.target.closest('.league-switcher-root')) {
        STATE.showLeagueSwitcher = false;
        R();
      }
    });

    function R() {
      try {
        document.getElementById('app').innerHTML = renderApp();
        saveState();
      } catch (err) {
        console.error('RYL render error:', err);
        clearSavedState();
        STATE.screen = 'landing';
        STATE.league = null;
        document.getElementById('app').innerHTML = renderLanding();
      }
    }

    // Internal tests removed from production build to avoid mutating app state.

    // ── Boot sequence ──────────────────────────────────────────────
    (async () => {
      STATE.authLoading = true;
      R(); // Show loading

      // Check if already logged in
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) {
        STATE.user = session.user;
        const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
        STATE.profile = profile;
        await loadState();
        if (STATE.activeLeagueId) subscribeToLeague(STATE.activeLeagueId);
      } else {
        // Not logged in — try localStorage for offline use
        try {
          const leaguesRaw = localStorage.getItem(LEAGUES_KEY);
          if (leaguesRaw) {
            STATE.leagues = JSON.parse(leaguesRaw);
            const activeId = localStorage.getItem(ACTIVE_LEAGUE_KEY);
            if (activeId && STATE.leagues.find(l => l.id === activeId)) {
              STATE.activeLeagueId = activeId;
              STATE.league = STATE.leagues.find(l => l.id === activeId);
              STATE.screen = 'app';
            } else if (STATE.leagues.length > 0) {
              STATE.activeLeagueId = STATE.leagues[0].id;
              STATE.league = STATE.leagues[0];
              STATE.screen = 'app';
            } else {
              STATE.screen = 'auth';
            }
          } else {
            STATE.screen = 'auth';
          }
        } catch(e) {
          STATE.screen = 'auth';
        }
      }

      STATE.authLoading = false;
      R();

      // Listen for auth changes
      sb.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT') {
          STATE.user = null;
          STATE.profile = null;
          STATE.league = null;
          STATE.leagues = [];
          STATE.screen = 'auth';
          R();
        }
      });
    })();
  </script>
</body>
</html>
